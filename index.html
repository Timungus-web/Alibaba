<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Сценарий «Али-Бабы»</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=PT+Mono&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one reading column, sticky control bar on top; script set like a prompt book — mono cues, serif speech, sans stage directions */
:root{
  --bg:#f4f6f8; --paper:#ffffff; --ink:#1b2030; --muted:#5f6779; --line:#dbe0e7;
  --accent:#0d6d76; --accent-ink:#ffffff;
  --mine:#fff0c2; --mine-bar:#c98a00; --group:#fbf6e6; --mention:#e2f0f1; --cue-bg:#eef1f5;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-text:"PT Serif",Georgia,"Times New Roman",serif;
  --f-mono:"PT Mono","Courier New",ui-monospace,monospace;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --paper:#191d26; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2a3040;
  --accent:#4cbcc4; --accent-ink:#0b1216;
  --mine:#3b3014; --mine-bar:#f0b429; --group:#2a2616; --mention:#163538; --cue-bg:#1f2430; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --paper:#191d26; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2a3040;
  --accent:#4cbcc4; --accent-ink:#0b1216;
  --mine:#3b3014; --mine-bar:#f0b429; --group:#2a2616; --mention:#163538; --cue-bg:#1f2430; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.title{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.who{flex:1;min-width:0;text-align:left;background:var(--cue-bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.who small{color:var(--muted);font-weight:400}
.ibtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-width:40px;height:38px;cursor:pointer;padding:0 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:disabled{opacity:.45;cursor:default}
select.jump{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;height:38px;padding:0 8px}
.chk{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);font-size:14px;cursor:pointer}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.col{max-width:720px;margin:0 auto}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;color:var(--muted)}
.summary b{color:var(--ink)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}

.scene{margin-bottom:28px}
.sh{font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;padding:18px 0 8px;border-bottom:2px solid var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;scroll-margin-top:120px}
.sh span{font-weight:400;color:var(--muted);letter-spacing:0;font-family:var(--f-ui);font-size:13px}
.cast{font-size:13px;color:var(--muted);margin:-4px 0 14px;line-height:1.5}
.cast b{color:var(--ink);font-weight:600}
.blk{margin:0 0 14px;font-size:var(--fs);scroll-margin-top:130px}
.act{font-family:var(--f-ui);font-size:calc(var(--fs) - 2px);color:var(--muted);padding:2px 0}
.act.mention{background:var(--mention);color:var(--ink);border-radius:8px;padding:6px 10px;margin-inline:-10px}
.cue{font-family:var(--f-mono);font-size:calc(var(--fs) - 3px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ln{font-family:var(--f-text);padding:1px 10px;margin-inline:-10px;border-left:3px solid transparent}
.ln.L{font-style:italic}
.ln.P{font-style:italic;color:var(--muted);font-size:calc(var(--fs) - 2px);padding-left:26px}
.ln.mine{background:var(--mine);border-left-color:var(--mine-bar)}
.ln.group{background:var(--group);border-left-color:var(--mine-bar);border-left-style:dotted}
.ln.mine:first-of-type,.ln.group:first-of-type{border-top-right-radius:6px}
.ln.hide{color:transparent;text-shadow:none;cursor:pointer;position:relative}
.ln.hide::after{content:"нажмите, чтобы открыть";position:absolute;left:12px;top:1px;color:var(--muted);font-family:var(--f-ui);font-style:normal;font-size:13px}
.ln.hide.L::after{content:"♪ нажмите, чтобы открыть"}
.blk.lead{opacity:.62}
.lead-tag{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.gap{text-align:center;color:var(--muted);letter-spacing:.4em;margin:-4px 0 12px;font-size:13px}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .18)}

.sheet{position:fixed;inset:0;z-index:20;background:rgb(10 12 18 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--paper);width:100%;max-width:720px;max-height:86%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:17px;margin:0;flex:1}
.sheet-body{overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 16px}
.sheet-body h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:600}
.sheet-body p{margin:0 0 6px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>

</head>
<body>
<header class="bar">
  <div class="bar-in">
    <div class="row">
      <span class="title">Али-Баба</span>
      <button class="who" id="who" type="button">Выбрать свою роль</button>
      <button class="ibtn" id="fsDown" type="button" aria-label="Мельче">A−</button>
      <button class="ibtn" id="fsUp" type="button" aria-label="Крупнее">A+</button>
    </div>
    <div class="row">
      <div class="seg" role="group" aria-label="Что показывать">
        <button id="mAll" type="button" aria-pressed="true">Весь текст</button>
        <button id="mMine" type="button" aria-pressed="false">Моя роль</button>
      </div>
      <select class="jump" id="jump" aria-label="Перейти к сцене"></select>
    </div>
    <div class="row" id="rehRow" hidden>
      <label class="chk"><input type="checkbox" id="hideMine"> Проверить себя: скрыть мои слова</label>
    </div>
  </div>
</header>

<main><div class="col" id="out"></div></main>
<button class="fab" id="next" type="button" hidden>Моя следующая ↓</button>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-in" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet-head">
      <h2 id="sheetTitle">Кого вы играете?</h2>
      <button class="ghost" id="clearSel" type="button">Сбросить</button>
      <button class="primary" id="doneSel" type="button">Готово</button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<script id="data" type="application/json">[{"title":"Сцена 1 · Пролог: Мустафа и Собирательница","blocks":[{"a":"СИ ходит по залу, в конце выходит на сцену. На сцене Мустафа."},{"a":"Мустафа выходит, садится. чинит башмак, Баширова Э. выходит, стучит в барабан, Ахмед выходит, ему жарко, ложится на стул, накрытый покрывалом. Из-за кулис подходит Гордин С., забирает ботинок, обувается, встает. СИ оглядываясь, выходит на сцену."},{"c":"Собирательница Историй","l":[["D","Скажи мне, почтенный сапожник, не тебя ли зовут Мустафой, который знает про всё на свете?"]]},{"c":"Мустафа","l":[["P","(чинит башмак)"],["D","Ах, любезная прохожая, я и был таким Мустафой, которого знал весь персидский базар, как такого Мустафу, который знает про всё на свете, но теперь...У тебя что, отвалилась подошва от башмака?"]]},{"a":"СИ смотрит на свою подошву, говорит- нет…"},{"c":"Мустафа","l":[["D","Тогда... Проходи мимо, дай мне спокойно починить этот каблук."]]},{"c":"Собирательница Историй","l":[["D","Я хожу по вашей стране и собираю сказки и истории, чтобы дети разных стран знали сказки Шехерезады или правдивые истории Мустафы сапожника."]]},{"a":"Во время разговора Гордин В.. расталкивает спящего. Он не просыпается. Баширова Э. стучит ему над ухом, то над одним, то над другим. Ничего не выходит. Садится и продолжает стучать. Тогда из-за кулис выходит Гордин С.., поднимает спящего с Гординым В. и они уводят его за кулисы"},{"c":"Собирательница Историй","l":[["D","Почтенный сапожник Мустафа, мудрейший Али-Баба, с которым меня cвёл случай, посоветовал мне послушать твой рассказ про мудрейшего Али-Бабу"],["P","(барабан перестает стучать)"],["D","…про его брата Касыма"],["P","(дробь)"],["D","...и сорок каких-то разбойников"]]},{"c":"Мустафа","l":[["P","(встает)"],["D","Так!"]]},{"c":"Собирательница историй","l":[["D","Никому в мире он не доверит своей истории так, как доверяет её почтенному Мустафе. Так сказал Али-Баба."]]},{"c":"Мустафа","l":[["D","Вах! Тогда садись"]]},{"a":"Варшавская А. выносит циновку, потом забирает табурет и уносит его, Голуб Н. выносит вазу с фруктами на голове и ставит перед СИ, Баширова Э. уходит за кулисы"},{"c":"Мустафа","l":[["D","я буду говорить, а ты будешь слушать! Итак, Персия!"]]}]},{"title":"Сцена 2 · «Персия»","blocks":[{"a":"Хор (песня и танец): Сергиенко К., Алифанов С, Гусманов Т., Шмитке А., Сабурова А., Варшавская А., Баширова Э. Смыкова А, Гордина Н, Голуб Н., Барчук В."},{"c":"Хор","l":[["L","Персия, Персия, Персия, Персия"],["L","Персия, Персия, Персия, Персия"],["L","А-а-а-а, А-а-а-а, А-а-а-а, А-а-а-а."],["L","Здравствуйте сегодня, здравствуйте всегда,"],["L","Здравствуй, кто угодно, подходи сюда!"],["L","Персия, Персия - фруктовый рай,"],["L","Персидские персики, зеленый чай."],["L","Если я, если я родился здесь,"],["L","Персия, Персия - страна чудес."],["L","Персия, Персия - фруктовый рай,"]]},{"c":"Варшавская","l":[["D","Персидские шали!"]]},{"c":"Хор","l":[["L","Персидские персики, зеленый чай."]]},{"c":"Голуб.","l":[["D","Расписные ковры!"]]},{"c":"Хор","l":[["L","Персия, Персия - словно в раю,"]]},{"c":"Барчук.","l":[["D","Здесь трали-вали, здесь женщин не видали"]]},{"c":"Хор","l":[["L","Честное, честное слово даю!"]]},{"c":"Баширова","l":[["D","Потому что чёрные чадры!"]]},{"a":"Голоса в проигрыше."},{"c":"Алифанов","l":[["D","Ты думаешь, я бедный и голодный, и потому худой?"]]},{"c":"Гусманов.","l":[["D","А Мустафа такой бедняк безродный - он потому худой?"]]},{"c":"Хор","l":[["L","Нет, нет, нет! Ошибаешься! Вот, вот, вот: убеждаешься!"],["L","Этот вот персидский, но простой народ"],["L","Очень много силы песням отдает,"],["L","Целый день поет он и танцует, вот!"],["L","Вот за что мы очень, вот такой народ!"],["L","Персия, Персия - страна чудес. Если я, если я родился здесь,"],["L","С песнею, с песнею теряю вес! Персия, Персия, Персия, Персия,"],["L","Персия, Персия, мой папа - перс!"]]}]},{"title":"Сцена 3 · «Рассказали»: наследство братьев","blocks":[{"a":"Уходят Хор и Али-Баба вправо, Хасан влево. Остаются рассказчицы Варшавская А. Баширова Э. Смыкова А., Барчук В."},{"c":"Барчук.","l":[["L","Однажды теплым светлым утром на базаре"],["L","Такую людям злую новость рассказали:"]]},{"c":"Смыкова.","l":[["L","У Али и Касыма, двух братьев родных,"],["L","Умер старый отец, умер добрый отец, рассказали."]]},{"c":"Баширова.","l":[["L","Брат Касым,"]]},{"a":"Касым выходит сзади, кладет из воздуха деньги в карман"},{"c":"Баширова.","l":[["L","старший брат, стал наследство копить:"],["L","Торговать, покупать, прибавлять и растить, рассказали."]]},{"c":"Смыкова А.","l":[["L","Младший Али-Баба (выпрыгивает сзади) стал дарить, угощать,"],["L","Все гостям раздавать, бедняков баловать, рассказали"]]},{"a":"Касым и Али-Баба здороваются «Салам алейкум»"},{"c":"Варшавская.","l":[["L","За Касыма женой отдал дочь Фатиму"]]},{"a":"Фатима выходит, жест руками вверх, хватает Касыма за руки, уводит за кулисы"},{"c":"Варшавская.","l":[["L","Отдал главный судья и в придачу дворец, рассказали."]]},{"c":"Все","l":[["P","(поют)"],["L","В жены Али-Баба взял подругу Зейнаб"]]},{"a":"Зейнаб выходит к Али- Бабе."},{"c":"Все","l":[["L","Им на свадьбу кувшин отдал бедный отец"]]},{"a":"из кулис выходит с кувшином Гордин С., наряженный в деда в солнечных очках и уходит за кулисы"},{"c":"Все","l":[["L","Рассказали! Рассказали!"]]},{"c":"Варшавская.","l":[["D","Вот так, одному кувшин, а другому дворец."]]},{"c":"Все","l":[["D","Да…да.. вах"]]}]},{"title":"Сцена 4 · «Съешь апельсин»","blocks":[{"a":"Все ушли за кулисы влево. На сцене СИ и Мустафа. разбойники. выходят, садятся по турецки, как бы беседуют."},{"c":"Собирательница Историй","l":[["D","Ага! Почтенный Мустафа, значит богатство сделало старшего Касыма жадным и злым?"]]},{"c":"Мустафа","l":[["D","Ты правильно поняла, но ты неправильно перебиваешь историю. Смотри и слушай."]]},{"a":"Уходят, выходит Фатима и Касым"},{"c":"Фатима","l":[["D","Эй Касым, а Касым? Касым."]]},{"c":"Касым","l":[["D","Говори, Фатима."]]},{"c":"Фатима","l":[["D","Брат твой уходит босым."]]},{"c":"Касым","l":[["P","(с усмешкой)"],["D","От большого ума."]]},{"c":"Фатима","l":[["D","Очень умный твой брат очень добрый твой брат- на базаре о нём говорят."]]},{"c":"Касым","l":[["D","А что они обо мне говорят?"]]},{"a":"Песня. Съешь апельсин."},{"a":"15 сек плюс"},{"c":"Касым","l":[["L","А что они обо мне говорят?"]]},{"c":"Фатима","l":[["L","О тебе все вздыхают подряд: \"Брат Касым, он всего лишь богат!\""]]},{"c":"Касым","l":[["L","Эй, Фатима!"]]},{"c":"Фатима","l":[["L","Слушаю, мой муж Касым."]]},{"c":"Касым","l":[["L","Лимоны здесь, вот здесь хурма, инжир - все в погреб! Съешь апельсин!.."],["L","Наш Али Баба, ты знаешь сама, очень глупый бедняга, а ты... съешь апельсин."],["L","Болтунов на базаре ожидает тюрьма, твой папаша Судья, а ты... съешь апельсин."],["L","Золотое шитье, какова бахрома, ткани быстро в подвал и... съешь апельсин..."],["L","Ва-бу-бу-ба... Ву-бу-бу-бу..."],["L","А завистников драных в такие дома не пускают хоть трижды он брат, Фатима, слышишь?"]]},{"c":"Фатима","l":[["L","Слушаю, мой муж Касым."]]},{"c":"Касым","l":[["L","А завистников драных в такие дома не пускают хоть трижды он брат, Фатима, слышишь?"]]},{"c":"Фатима","l":[["L","Слушаю, мой муж Касым."]]},{"a":"уходят, с другой стороны выходят З и АБ"}]},{"title":"Сцена 5 · «Но очень жарко»","blocks":[{"c":"Мустафа","l":[["D","На востоке все решает солнце. Может быть, о жарком нашем климате и любили поговорить красавица Зейнаб и её Али-Баба."]]},{"a":"Зейнаб, Али-Баба:"},{"a":"Мустафа провожает СИ, идет к мужчинам и садится с ними. А.Б и З. выходят из кулис и поют. КрУгом сидят Орлов., Гордин С., Гордин В., и Мустафа. Один Гордин В. встает и начинает махать опахалом на поющих, на зрителей. Во время пения Баширова выходит с кувшином на плече и медленно наливает сидящим чай"},{"c":"Зейнаб","l":[["L","На Востоке простор,"],["L","Над простором шатер, Над седой шапкой гор"],["L","Гордо-синий ковер, Но очень жарко."]]},{"c":"Али-Баба","l":[["L","Можно ткать,"]]},{"c":"1 мужчина Ахмет.","l":[["L","можно шить,"]]},{"c":"2 мужчина Гордин С.","l":[["L","Можно трубку курить,"],["L","Можно жить-не тужить,"]]},{"c":"Зейнаб, Али-Баба","l":[["L","И друг друга любить,"]]},{"c":"Все вместе","l":[["P","(кто находится на сцене)"],["L","Но очень жарко."]]},{"c":"Али-Баба и Зейнаб","l":[["L","На Востоке живешь, в гости друга зовешь,"],["L","На Востоке живешь, весь базар позовешь,"],["L","Наш обычай хорош, Но очень жарко."],["L","Постареешь - поймёшь: Жарко жить, а умрёшь"],["L","- Ай-ай-ай-ай! Очень жалко!"]]},{"a":"З и А-Б разговаривают, расходятся Разбойники на ходу говорят свои слова и идут в заднюю дверь. Мустафа уходит за кулисы"},{"c":"Мустафа","l":[["D","Хорошо смеяться, когда совесть чистая!"]]},{"c":"Зейнаб","l":[["D","Хорошо веселиться,"]]},{"c":"Али-Баба","l":[["D","когда семья счастливая!"]]},{"c":"Орлов.","l":[["D","Ай, хорошо смеяться, когда в доме шаром покати:"]]},{"c":"Гордин С","l":[["D","Последнюю рисинку последнего плова гости доели."]]},{"c":"Гордин В.","l":[["D","Али-Баба и Зейнаб с голодухи помрут. Вах!"]]},{"a":"Разбойники ушли, остались З и А-Б."},{"c":"Зейнаб","l":[["D","Твои руки, лишь, и голова нас спасут!"]]},{"c":"Али баба","l":[["D","Да, моя Зейнаб, я что-пибудь придумаю"]]},{"a":"Али-Баба уходит."},{"a":"Песня Зейнаб."}]},{"title":"Сцена 6 · Лес и сорок разбойников","blocks":[{"c":"Мустафа","l":[["D","И завтра, и послезавтра уходил Али баба в лес, на базаре с утра продавал дрова и жил бы его дом миром…Если бы не страшный случай."]]},{"a":"Зейнаб уходит за кулисы, АБ ходит по лесу"},{"a":"Из кулис выходят:"},{"c":"Барчук В","l":[["L","Ах, горы Персии, солнечный край! Леса густые - ходи и наблюдай."]]},{"c":"Баширова Э.","l":[["L","Ходил Али-Баба, рубил и напевал."],["L","Вдруг, чей-то топот, шепот, всадников привал."]]},{"c":"Смыкова А.","l":[["L","Эта быль, уже не быль, а небыль:"],["L","Вдоль ущелья только пыль до неба."]]},{"c":"Варшавская А.","l":[["L","Там, где за день двух людей не встретил"],["L","От людей и лошадей ужасный ветер."]]},{"a":"ушли за кулисы"},{"c":"Али-Баба","l":[["L","Сорок конных безобразных ураган,"],["L","Впереди их одноглазый атаман!"]]},{"a":"А-Б мечется по сцене, потом испуганно прячется в кулисы и смотрит оттуда. Свист из задней двери, летит мешок, выходит Гордин С, вешает мешок на плечо, вылетает второй мешок, за ним выползает Гордин В, берет мешок, потом выходят остальные разбойники, дерутся, машут ногами."},{"c":"Атаман","l":[["D","С коней слезай! …Мешки выгружай!….У пещеры становись!!! По порядку назовись!"]]},{"c":"Разбойники","l":[["P","(Гордин В)"],["D","Первый!"],["P","(Гордин С)"],["D","Пятый!"],["P","(Ефимов А.)"],["D","двадцатый"],["P","(Орлов)"],["D","Тридцать пятый!"]]},{"a":"Атаман выходит (величественно с, обращенными к небу, руками.)"},{"c":"Атаман","l":[["D","Сороковой я, Хасан!"]]},{"a":"Разбойники в это время склоняют головы"},{"c":"Атаман","l":[["D","Разбойники, строй-ся! Сим-Сим, Сезам, открой-ся! Мешки в пещеру заноси!"]]},{"a":"Зашли в пещеру, оставили мешки в пещере, выходят оттуда, Хасан их проверяет, раздает им мечи"},{"c":"Атаман","l":[["D","Сим-Сим, Сезам, закройся."]]},{"c":"Атаман","l":[["D","Нас мало, но каждый из нас стоит десятка отважных разбойников."]]},{"a":"(минус)"},{"c":"Разбойники","l":[["L","Снова кони, пыль и ураган."],["P","(ноги в стороны, локти вверх-вниз)"],["L","Вместе с нами одноглазый атаман."]]},{"a":"Вступление (рука вверх с мечом., нога вперед)"},{"c":"Разбойники","l":[["L","Мы бесшумная команда (шаг вперед, шаг назад), Злая банда атамана"],["P","(шаг вперед, шаг назад)"],["L","Шито-крыто, крыто-шито"],["P","(меч в сторону, потом в другую)"],["L","вах!"],["P","(руки вверх)"],["L","Мы воды в реке не мутим: Убиваем, а не шутим!"],["P","(рок эн ролл)"],["L","Шуто-круто (шаг вперед боком), круто-шуто (еще шаг вперед боком) вах!"],["P","(ножи к горлу)"],["L","Что награбим - сохраним."],["P","(скрещивают руки над головой)"],["L","Все укроет грот Сим-Сим!"],["P","(медленно опускают руки)"]]},{"a":"Атаман в это время ходит впереди и медленно водит мечом перед зрителями"},{"c":"Разбойники","l":[["L","Четко, кротко, кротко, четко, вах!"]]},{"a":"Машут мечами кто во что горазд."},{"c":"Разбойники","l":[["L","Ваши важные горшки Быстро прячем мы в мешки"],["P","(мечами влево, вправо)"],["L","Шатко, кратко, кратко, шатко (колени танцуют), вах!"],["P","(ножи к горлу Атаману)"],["L","Мы бесшумная команда, Злая банда атамана."],["P","(двое меняются местами)"],["L","Шито-крыто, крыто-шито (двое меняются местами), вах!"],["L","Что награбим - сохраним."],["P","(один машет шашкой сзади, на слог НИМ присели)"],["L","Все укроем в грот Сим-Сим."],["P","(на слог СИМ Атаман на ноги двум)"],["L","Четко, кротко, кротко, четко, вах!"]]},{"a":"на последние слова убегают с криками в заднюю дверь"}]},{"title":"Сцена 7 · Али-Баба в пещере","blocks":[{"c":"Али-Баба","l":[["P","(выходит из-за кулисы)"],["L","Ну что ты потеряешь, Если все узнаешь?"],["L","Сим-Сим, откройтесь, будьте так добры!"]]},{"a":"Сим-Сим открывается, А.Б. заходит"},{"c":"Али-Баба","l":[["L","Ах, спасибо, награди тебя Аллах!"],["L","Ах, смотрите все в коврах, зеркалах!"],["L","Копья, шлемы, ах, кинжалы, ах, мечи!"],["L","Что в кастрюлях? Плов? Вкусней, чем ел Аллах!"],["L","Моя бедная Зейнаб, не видишь ты,"],["L","Я возьму тебе немного, скажешь, \"ах\"!"],["L","Вот я взял, незаметно сколько взял,"],["L","Даже стало еще больше в зеркалах,"],["P","(выходит)"],["L","Все глаза устали, сыт я и устал."],["L","Завтра утром накормлю я весь базар."],["L","Но ни звука о Сим-Сим и зеркалах."]]},{"a":"АБ уходит"}]},{"title":"Сцена 8 · Зейнаб ждёт мужа","blocks":[{"c":"Зейнаб","l":[["P","(выходи из-за кулис)"],["L","Спустилось солнце два часа тому назад."],["L","Ушел мой муж и не вернулся он назад!"],["L","Куда бежать, Али-Баба? Вперед? Назад?"],["L","Спустилось солнце два часа тому назад."],["L","Кто нам поможет, беднякам, где силы взять?"],["L","Аллах высоко, а султан - где денег взять?"],["L","Что делать, помощь Персии, ни дать, ни взять?"],["L","Кто нам поможет, беднякам, где силы взять?"],["L","В горах давным-давно черным-черно, наверно!"],["L","А во дворцах спит каждое окно, наверно!"],["L","Али-Бабу съел дикий волк давно, наверно!"],["L","В горах давным-давно черным-черно, наверно!"],["L","А во дворцах спит каждое окно, наверно."],["L","В горах давным-давно черным-черно, наверно."],["L","Али-Бабу съел дикий волк давно, наверно."]]},{"c":"Али-баба","l":[["P","(выбегает)"],["D","Помолчи, Зейнаб!"],["L","Иди сюда, гляди сюда, молчи!"],["L","Налей мне чай и помогай, молчи!"],["L","Тише ресницами моргай, молчи!"],["L","Султан услышит - и прощай, молчи!"],["L","Динары в землю засыпай, молчи!"]]},{"c":"Зейнаб","l":[["P","(обиженно)"],["D","Ты слова правды не сказал своей Зейнаб."]]},{"a":"Смыкова А. выходит из кулис, напевает во время разговора З и А-Б, как будто подслушивает."},{"c":"Али-Баба","l":[["L","Ах, варенный я ишак Три уха набекрень!"],["L","Ах, бумажный я кушак, Тюфяк, корявый пень."],["L","Слушай, слушай, слушай!"]]},{"a":"уходят"}]},{"title":"Сцена 9 · Мерка с мёдом","blocks":[{"c":"Смыкова А.","l":[["P","(Когда они уходят, говорит свои слова.)"],["D","Прошла ночь, солнце выспалось, небеса проснулись, разогрелось утро..."]]},{"a":"Уходит за кулисы"},{"c":"Зейнаб","l":[["P","(выходит из класса ВМ)"],["L","Без счета наше золото в земле лежит,"],["L","От страха все дрожит, ой, надо торопиться!"],["P","(зовет)"],["D","Эй, Фатима, а Фатима!"]]},{"a":"Ф. выбегает из-за кулис"},{"a":"минус"},{"c":"Зейнаб","l":[["L","Вот есть крупа, а мерки нет,"],["L","Но есть крупа, вот, Фатима,"],["L","а мерки мерить, значит, нет!"],["L","Хотя крупы... есть, Фатима. И даже много!"],["L","Мерки нет! Ты дашь мне мерку, Фатима?"]]},{"c":"Фатима","l":[["L","Вах, много слов, зачем так много треска,"],["L","Ты мне невестка или не невестка?"],["L","Здесь во дворе постой, а в дом не заходи,"],["L","Ты мне невестка или не невестка?"],["L","Циновки в доме чистые, Зейнаб."],["L","Не знаю, ноги мыла ли, ейская дочь!"]]},{"a":"уходит за кулисы, Касым бежит за Ф."},{"a":"Али-Баба выходит из класса ВМ, чистит таз у себя во дворе. Приходит Касым из кулис ножом."},{"c":"Али-Баба","l":[["D","Салям алейкум, здрасте, Касым, мой старший брат! Как сей восход прекрасен, так тебе я рад! Как говорила наша бабушка, кто обидел эти маленькие глазки?"]]},{"a":"Песня Касыма"},{"c":"Али-Баба","l":[["D","Слушай ворон новый, Слушай брат-невежа"],["D","Мне нечего скрывать, Я не умею воровать…"],["D","Это правда, это факт. Слушай, вышло это так..."]]},{"a":"уходят за кулисы"},{"c":"Мустафа","l":[["P","(высовывается из-за кулис)"],["D","Брат брату правду всю сказал."],["D","Про дверь и про Сим-Сим, Про все, что было с ним."]]},{"a":"К и Ф выходят из-за кулис, беседуют по секрету, в стороне встают, посмотрели на зрителей, которые их подслушивают, отошли в другую сторону"},{"c":"Касым","l":[["P","(Фатиме)"],["D","Десять мулов по два сундука: не мало будет? Напомни брату - дома пусть сидит,"],["D","За мной пусть не следит, Не то как звать его забудет!"]]},{"c":"Фатима","l":[["D","Ты сам-то не забудь сказать слова,"],["D","Ведь дверь-то может не открыться!"]]},{"c":"Касым","l":[["D","Ой, ой, как кружится голова,"],["D","Ой, ой, как голова кружится!"]]},{"a":"прощаются"}]},{"title":"Сцена 11 · Касым в пещере","blocks":[{"c":"Касым","l":[["P","(Присел)."],["L","Ой, устал! Что теперь?"],["L","Между скал – Дверь"],["P","(обрадовался)"],["L","Эй, Сим-сим - откройся!"]]},{"a":"Сим-Сим открывается"},{"c":"Касым","l":[["L","Ой, ой, ой! Ах, смотрите - все в коврах!"],["L","Ах, смотрите - в зеркалах!"],["L","Сокровища, сокровища, сокровища! Ха-ха!"]]},{"a":"долго ликует, вытаскивает сундук, короб, рассматривает"},{"c":"Касым","l":[["L","Это мне. Это Фатиме."],["L","Все заберу, мне всё здесь надо! Не будь я Касым. Ха-ха-ха!"],["P","(посмотрел на дверь, удивился)"],["L","Эй,дверь, давай открывайся…УченЫй дверь! Ждешь словечка? Ага!"],["L","Конопля, откройся! Как тебЕ зовут, черт, забыл!"],["P","(думает)"],["L","Горох, откройся! Вот упрямый зверь..."],["L","Открывайся давай! Как тебя зовут. Капуста, свекла, редька."],["L","У меня мулы простудятся, слышишь, мычвт…"],["L","Эй, фасоль, откройся!"],["L","Кто там? Ветер... Ага... уже ночь. Вот это да!"],["L","Эй, Али-Баба! Как ты там говорил, а?"],["L","Овес! Конопля! Конопля уже было..."],["L","Ячмень! Дорогой, открой!!!"],["L","Ты что - сердитый стал, Что я так много взял?"],["L","Пожалуйста, я не жадный - хочешь -"],["L","Смотри-ка этих шаровар, вот тебе пять пар!"],["L","Нет-нет, две пары, ладно?"],["L","Вот - кладу обратно. Теперь тебе приятно?"],["L","Приятно теперь? Открывайся, дверь!"],["L","Али-Баба! Чтоб ты сдох! Проклятый врушка!"],["L","Эй! Укроп! Морковь! Петрушка!"],["L","Вот это беда! Забыл! Навсегда!"],["L","Али-Баба, спасай, братушка!"],["L","Алибабашенька, Алибабушка!"]]},{"a":"Приходят разбойники"},{"c":"Атаман","l":[["D","Сим-Сим, откройся!"]]},{"a":"Сим-Сим открывается, Касым сидит, накрытый прозрачной тканью. Разбойники увидели его, Хасан снимает ткань"},{"c":"Касым","l":[["D","Ой, спасибо! Немножко забыл."],["D","Немножко память, как у верблюда,"],["D","\"Сим-Сим, откройся!\" Сим-Сим открыл!"],["D","Вы все сюда, а я – отсюда"]]},{"a":"выходит из пещеры, Гордин В. ставит подножку, Касым садится на колени, все остальные снимают с него драгоценности"},{"c":"Атаман","l":[["D","Как тебя зовут, разбойник?"]]},{"c":"Касым","l":[["D","Я разбойник? Я - Сим-Сим!"]]},{"a":"Ахмед ему нож к горлу"},{"c":"Разбойники","l":[["D","Ха-ха-ха!"]]},{"c":"Атаман","l":[["D","Ты, по-моему, покойник. Эй, Ахмед!"]]},{"c":"Ахмед","l":[["D","Я Ахмед-сорвиголова, на дворе трава, на траве дрова."]]},{"c":"Атаман","l":[["D","Займись-ка им."]]},{"c":"Ахмед","l":[["D","Ты кто такой, пустой тюрбан?"]]},{"c":"Касым","l":[["D","Я... эээ... этот... Добрый вечер, атаман!"]]},{"a":"путает Атамана. Ахмед говорит- Вон Атаман"},{"c":"Касым","l":[["D","Эээмм... Я - Фатима, эээ, нет, я - муж конопли, ммбуне. Конопля, пещерка, дверка. Я все забыла!"]]},{"c":"Ахмед","l":[["D","Смотрите, Хасан, от страха разбойника перекосило. Он стал от жадности совсем косым."]]},{"c":"Касым","l":[["D","Ой! Вспомнил! Меня косут Зовым."],["D","Эй не.. Зовыт Косум. То есть, эээ: зовыт Косэм"],["D","Ааа, а вас зовут \"Сим-Сим, откройся\"?"]]},{"c":"Атаман","l":[["D","Ахмед!"]]},{"c":"Ахмед","l":[["D","Я Ахмед!"]]},{"c":"Атаман","l":[["D","Сорви голова!"]]},{"c":"Ахмед","l":[["D","Есть сорви голова!"]]},{"c":"Касым","l":[["D","Не надо сорви голова, Не надо сорви голова!"]]},{"a":"одевает на голову мешок, заталкивает в пещеру"},{"c":"Касым","l":[["D","Я больше не буду вороваааать!"],["D","Я больше не буду вороваааать!"]]},{"c":"Атаман","l":[["D","Сезам слезам не верит. Ахмед!"]]},{"c":"Ахмед","l":[["D","Я Ахмед! Касым!"]]},{"c":"Атаман","l":[["D","Сезам, Закройся."]]},{"a":"Закрывается ткань Разбойники убегают в заднюю дверь. Касым разворачивает Сезам."}]},{"title":"Сцена 12 · Горе Фатимы","blocks":[{"a":"Фатима выходит из кулис, зовет Касыма. Увидела А-Б (вышел из-за кулис), заплакала. Села на колени."},{"c":"Али-Баба","l":[["P","(присаживается, успокаивает ее)"],["D","Я дам тебе золото, Фатима, О брате молчи навсегда, Фатима."]]},{"c":"Фатима","l":[["P","(плачет)"],["D","Али-Баба!"]]},{"c":"Али-Баба","l":[["D","Ты будешь у нас и сыта и согрета,"],["D","Но тайну забудь навсегда, Фатима."]]},{"a":"обнимает ее"},{"c":"Фатима","l":[["D","Али-Баба!"]]},{"c":"Али-Баба","l":[["P","(поднимает Фатиму)"],["D","Для жадных, для добрых - свой путь, Фатима,"],["D","Касым был косым, ну и пусть, Фатима."],["D","Он братом мне был и останется братом."],["D","Как умер он - тайна моя, Фатима."],["D","Съели горные волки Касыма, Как я вам сказал!"]]}]},{"title":"Сцена 13 · Разбойничий привал","blocks":[{"a":"А.Б и Ф. уходят в класс ВМ. Из-за кулис выходят Мустафа, СИ."},{"c":"Собирательница Историй","l":[["D","И что, истории конец?"]]},{"c":"Мустафа","l":[["D","Ай, слушай, иди своим путем, что ты пристала ко мне."]]},{"c":"Собирательница Историй","l":[["D","Но ведь истории твоей не конец?"]]},{"c":"Мустафа","l":[["D","Ну, не конец."]]},{"c":"Собирательница Историй","l":[["D","Так расскажи, что было дальше, наконец?"]]},{"c":"Мустафа","l":[["D","Ах, горы Персии, солнечный край!"],["D","Леса густые - ходи и наблюдай."],["D","Если бы Али-баба зашел за перевал,"],["D","Он узнал бы, что Хасан бандитам приказал."]]},{"c":"Собирательница Историй","l":[["D","А что за перевалом?"]]},{"c":"Мустафа","l":[["D","Разбойничий привал."]]},{"a":"СИ и Мустафа уходят за кулисы"},{"a":"выходят разбойники."},{"c":"Ахмед","l":[["P","(выбегает в зал)"],["D","Разговоры кончать! Встречать Атамана!"]]},{"a":"Атаман выходит"},{"c":"Разбойники","l":[["P","(танцуют с руками к небу)"],["L","Обскачи весь белый свет,"],["L","Никого умнее нет Нашего Хасана!"]]},{"c":"Хасан","l":[["L","Браво, браво! Ну, что вы, право!"]]},{"c":"Разбойники","l":[["P","(просто танцуют)"],["L","Проживи две тыщи лет,"],["L","Никого моложе нет Нашего Хасана!"]]},{"c":"Хасан","l":[["L","Браво, браво! Ну, что вы, право!"]]},{"c":"Разбойники","l":[["L","Обскачи весь белый свет,"],["L","Никого смелее нет Нашего Хасана!"],["L","Солнцем Персии согрет,"],["P","(садятся на колени, молятся)"],["L","Получи, Хасан, привет И осанну!"]]},{"c":"Разбойники","l":[["P","(встают, танцуют)"],["L","Есть ещё один куплет:"],["L","Никого скромнее нет Нашего Хасана!"]]},{"a":"Ахмед садится перед атаманом, тот кладет ему ноги на плечи"},{"c":"Хасан","l":[["L","Очень правильный куплет:"],["L","Никого скромнее нет Вашего Хасана! Вашего меня!"]]},{"a":"Ахмед (Атаман гладит его по голове)."},{"c":"Ахмед","l":[["D","Я Ахмед…"]]},{"c":"Хасан","l":[["D","Надо поговорить с глазу на глаз."]]},{"c":"Ахмед","l":[["D","Слушаю, мой атаман, слушаю тебя... то есть, вас."]]},{"a":"встают, уходят за кулисы"},{"a":"Разбойники:"},{"c":"Гордин С.","l":[["D","Увёл любимца, Хасан одноглазый. Скука, разбойники, скука!"]]},{"c":"Гордин В.","l":[["D","\"С глазу на глаз\", а Ахмед-то двуглазый."],["D","\"С носу на нос\", сказал бы уж сразу!"]]},{"c":"Антон","l":[["D","Нет, \"с уха на ухо\"!"]]},{"c":"Горлин В.","l":[["D","Тише! Не злите Хасана."]]},{"c":"Гордин С.","l":[["D","Песню?"]]},{"c":"Антон","l":[["D","Давай."],["D","- Про старые раны."]]},{"a":"Садятся"},{"c":"Разбойники","l":[["L","Любит Аллах в белых чалмах"],["L","Все вершины в горах, а у нас - старые раны."],["L","Пьёт атаман, ест атаман,"],["L","Он живет как султан, а у нас - старые раны."],["P","(встают, друг друга поддерживают)"],["L","Люди живут, пляшут, поют,"],["L","Берегут свой приют, а у нас - старые раны."],["L","Утром вставай, режь (по горлу), убивай,"],["L","Всё ему (рукой в сторону кулис) отдавай, а себе - старые раны."]]},{"a":"ВЖ танец. Р поют по одному"},{"c":"Разбойники","l":[["L","Сладкие сны: Мир без войны!"],["L","Мне отсюда видны Все усталые страны."],["L","Кто мне простит? Нету пути."],["L","Мне вовек не войти В эти старые храмы."],["P","(сели, ВЖ над ними руками)"],["L","Нет ни семей, нет ни детей,"],["L","Нет ни кровли своей, есть у нас старые раны."],["L","Любит Аллах в белых чалмах"],["L","Честный люд в городах, а у нас - старые раны"],["P","(руки поднять)"],["P","(качаются из стороны в сторону)"],["L","Любит Аллах в белых чалмах"],["L","Честный люд в городах, а у нас - старые раны"],["P","(руки опустили на грудь)"]]},{"c":"Ахмед","l":[["P","(выходит из за кулис, разбойники вскочили)"],["D","Разговоры кончать! Атамана встречать! Всем встать! Башки налево!"]]},{"c":"Хасан","l":[["P","(вышел из кулис)"],["D","Разбойники! Сообщаю новость: вчера в нашу пещеру кто-то заходил. Кто-то знает про Сим-Сим. Кто-то забрал голову нашего врага и унес в город. Кто-то забрал наши сокровища. Кто-то должен быть убит. Ахмед уходит в город. Ахмед - смелый разбойник. Кто-то не уйдет от Ахмеда. Ступай, Ахмед."]]},{"a":"Целует. Ахмет уходит за кулисы"},{"c":"Хасан","l":[["D","Мы ждем тебя с новостями."]]},{"a":"утанцовывают в заднюю дверь,"},{"a":"Выбегает Ахмет с пранже, слышит голоса - это Зейнаб и Фатима громко что-то рассказывают друг другу про Али –бабу,. Ахмет рисует крестик на их доме."}]},{"title":"Сцена 14 · Крестики на воротах","blocks":[{"c":"Фатима","l":[["P","(выходит с тазом, встречает Ахмета, тот- Асамалекум. Ханум тонким голосом, и убегает смешно в заднюю дверь)"],["D","Эй, Зейнаб, сестра моя, смотри, смотри!"]]},{"c":"Зейнаб","l":[["P","(высовывает голову из класса ВМ)"],["D","Что, потолок на голову упал?"]]},{"c":"Фатима","l":[["D","Кто на воротах крестик рисовал?"]]},{"c":"Зейнаб","l":[["D","Возможно, дети, стоит ли кричать?"],["D","Я плов поставила, мне надо наблюдать."],["D","Не любишь крестики - возьми да и сотри."]]},{"c":"Фатима","l":[["D","Ай, подозренье мучает меня,"],["D","Что, если крестики домами поменять?"],["D","На всех воротах мелом начерчу, смотри!"],["D","Врагу Али-Бабы не видеть света дня"]]},{"a":"чертит крестики на домах и уходит. Темно, приходят разбойники из задней двери, как женщины и детей качают."},{"c":"Хасан","l":[["D","Идем и накажем нашего врага."]]},{"c":"Разбойники","l":[["D","А ужин."]]},{"c":"Хасан","l":[["D","Ужин вам не нужен."]]},{"c":"Ахмед","l":[["D","Так, всем молчать, слушать только атамана и меня, его помощника!"]]},{"c":"Хасан","l":[["D","Еще не помощника."]]},{"c":"Ахмед","l":[["D","Уже почти помощника. Вот - крестик белый - видели?"]]},{"c":"Хасан","l":[["D","Так!"]]},{"c":"Ахмед","l":[["D","Здесь живет Али-Баба - наш враг и брат врага нашего! Кто-то был вчера в пещере, так кто-то - это Али-баба."]]},{"c":"Разбойники","l":[["P","(Гордин В.)"],["D","- Ахмед, а в этих воротах тот же Али-Баба или другой?"],["P","(Гордин С)"],["D","- Глядите, атаман, и здесь вот белый крестик!"],["P","(Антон.)"],["D","- И здесь!"],["P","(все друг друга перебивают и показыкают по сторонам)"],["D","- И тут! - И тут, вот! - И там!"]]},{"c":"Хасан","l":[["D","Ахмед-сорвиголова!"]]},{"c":"Ахмед","l":[["D","Я Ахмед-сорвиголова на дворе трава, на траве дрова."]]},{"a":"садится на колени, просит- Не убиваааай"},{"c":"Хасан","l":[["D","Мухаммед!"]]},{"c":"Мухаммед","l":[["P","(Гордин В.)"],["D","Я Мухаммед!"]]},{"c":"Хасан","l":[["D","Сорви голова!"]]},{"c":"Мухаммед","l":[["P","(Гордин В.)"],["D","Есть!"]]},{"a":"уводит Ахмета за кулисы, и разбойники уходят туда же."}]},{"title":"Сцена 15 · Хасан-странник и кувшины","blocks":[{"a":"Зейнаб и Фатима выходят, поочереди кричат Али-Бабу. Выходит А-Б, поет, потом Зейнаб и Фатима выходят в танец."},{"c":"Али-Баба","l":[["P","(поет)"],["L","Был порядок на Земле простым-простой,"],["L","Каждый пятый был совсем смешным-смешной,"],["L","Каждый третий, каждый третий был заметен головой,"],["L","Лишь один из миллиона был герой."],["L","Был порядок на земле давно такой."],["L","Этот мир сегодня стал больным-больной"],["L","Очевидно от погоды от такой."],["L","Жил да был Али-Баба, жил да был Али-Бабой,"],["L","Вдруг кричат какой герой, какой святой."],["L","Этот мир сегодня стал совсем больной."],["L","Ай, мгновение прекрасное, постой!"],["L","Кто не злой, тот, значит, парень золотой!"],["L","Дайте быть Али-Бабе, дайте быть Али-Бабой,"],["L","Не качайте восхищенно головой."],["L","Дайте быть Али-Бабе Али-Бабой!"]]},{"c":"Хасан","l":[["P","(выходит из кулис переодетый)"],["D","Скажи, веселый господин, Как мне увидеть доброго Али-Бабу?"]]},{"c":"Али-Баба","l":[["D","Спасибо! Спасибо тебе, странник. Пускай нас называют добрыми после нашей смерти. А я сегодня, видишь, веселый Али-Баба."]]},{"a":"на вступление ВЖ выходят на сцену, поют. Перед кулисами выходят кувшины"},{"c":"Хор женщин","l":[["P","(поет)"],["L","Что-то будет! Что-то будет! Что-то будет! Что-то будет!"]]},{"c":"Хасан","l":[["L","Я иду издалека, (Что-то будет!)"],["L","Моя ноша нелегка. (Что-то будет!)"],["L","Если б ты знал, (Али-Баба!) Как я устал. (Али-Баба!)"],["L","Моя ноша нелегка, (Что-то будет!)"],["L","Дай поспать у огонька. (Что-то будет!)"],["L","Если б ты знал, (Али-Баба!) Как я устал. (Али-Баба!)"],["L","Дай поспать у огонька, (Что-то будет!)"],["L","Мулы отдохнут пока. (Что-то будет!)"],["L","Если б ты знал, (Али-Баба!) Как я устал."]]},{"c":"Али-Баба","l":[["L","Вот тебе моя рука, В дом входи, поешь слегка."],["L","На Востоке живешь, Весь базар позовешь,"],["L","Наш обычай хорош!"]]},{"c":"Хасан","l":[["L","Если б ты знал, (Али-Баба!) Как я устал. (Али-Баба!)"],["L","Если б ты знал, (Али-Баба!) Как я устал. (Али-Баба!)"]]},{"c":"Али-Баба","l":[["D","Фатима и Зейнаб,"],["P","(хотели что- сказать)"],["D","разговоры бросьте! Плов, лепешки и вина приготовим гостю."]]},{"a":"З и Ф уходят в класс ВМ"},{"c":"Хасан","l":[["D","Спасибо, почтенный хозяин,"],["D","Иди к себе в дом, я иду следом, только мулов привяжу."]]},{"a":"А-Б уходит"},{"c":"Хасан","l":[["D","Ух, ушёл. Сезам, врагу на веки отомстись,"],["D","Шутки бросим, по порядку из кувшинов отзовись!"]]},{"c":"Разбойники","l":[["D","- Раз!"],["D","- Восемь!"],["D","- Тридцать восемь!"]]},{"c":"Хасан","l":[["D","Сулейман!"]]},{"a":"(Гордин С..) высовывается из кувшина"},{"c":"Сулейман","l":[["D","Здесь, атаман!"]]},{"c":"Хасан","l":[["D","Отвечаешь за эту ночь. Тишина!"]]},{"a":"Выходит Али-баба."},{"c":"Али-Баба","l":[["D","Эй, гость дорогой, хватит звезды считать, честное слово! Пойдем, будем угощать тебя вкусным пловом."]]},{"c":"Хасан","l":[["D","Аллах да хранит этот чертог, мир сему крову!"]]}]},{"title":"Сцена 16 · Масло в кувшинах","blocks":[{"a":"Хасан уходит с А-Б за кулисы, Фатима и Зейнаб"},{"c":"Фатима","l":[["D","Зейнаб, Зейнаб, где масла взять?"],["D","Здесь мало для блинов опять!"],["D","Соседи улеглися спать,"],["D","Мы увлеклись, где масла взять?"]]},{"c":"Зейнаб","l":[["D","Ох сколько слов, что голова кружится."],["D","Ты мне сестрица или не сестрица."],["D","Иди во двор, там ни души, Вот до сих пор отлей в кувшин."],["D","Одолжим масло до утра, Потом вернем. Иди, сестра!"]]},{"a":"З. уходи. Голоса из кувшинов. Фатима ходит рядом."},{"c":"Разбойник","l":[["P","(Антон)"],["D","Эй, Сулейман!"]]},{"c":"Сулейман","l":[["P","(Сергей.)"],["D","Ну что?"]]},{"c":"Разбойник","l":[["P","(Антон)"],["D","Долго нам тут сидеть?"]]},{"c":"Сулейман","l":[["P","(Сергей)"],["D","Сколько надо, столько и будешь сидеть. Все доложу атаману,"]]},{"c":"Разбойники","l":[["P","(Влад)"],["D","Ладно, молчим! Слава помощнику Сулейману!"]]},{"a":"Зейнаб выходит и её сразу останавливает Фатима."},{"c":"Фатима","l":[["D","Ой, что там было, ой! Ставь масло на огонь, ой! Моя Зейнаб!"]]},{"c":"Зейнаб","l":[["D","Я ставлю, ставлю, не дрожи, Да что с тобою, эй, Фатима? Что там случилось? Али-Бабу позвать?"]]},{"c":"Фатима","l":[["D","Нет-нет, молчи! Нам надо Али-Бабу спасать! Слушай, - масло закипело? Нет? Скорей, скорей бы, - слушай: Там в двух кувшинах оливковое масло, А в тридцати восьми - разбойники!"]]},{"c":"Зейнаб","l":[["D","А-а-ай!"]]},{"c":"Фатима","l":[["D","Ну, ясно, наш гость - Хасан Одноглазый! Куда ты падаешь?"]]},{"c":"Зейнаб","l":[["D","Я? Кажется, в обморок! Я там не была ни разу. Али-Баба, мы в окружении! О, Фатима, я сойду с ума, Какое нам принять решение?"]]},{"c":"Фатима","l":[["P","(сбегала, вернулась с кастрюлей)"],["D","Ура, вскипело масло на печи! Беги, Хасана развлекай, молчи! Беги, не дай очухаться врагу! Ты вернулась из обморока?"]]},{"c":"Зейнаб","l":[["D","Да! Будем торопиться, я бегу!"]]},{"a":"уходит за кулисы, там берет угощение"},{"c":"Фатима","l":[["D","Ну, помогай Аллах! Все карты у меня!"],["D","Врагам Али-Бабы не видеть света дня!"],["D","Так! По порядку кувшинов разливай!"]]},{"a":"Ф ушла за кулисы"},{"c":"Разбойники","l":[["D","- Уй! - Ай! - Ой!"]]}]},{"title":"Сцена 17 · Плов и танец Фатимы","blocks":[{"a":"Из-за кулис выходят А-Б и Хасан. С ними Зейнаб, стелет коврик, еду."},{"c":"Зейнаб","l":[["P","(подходит к ним, угощает)"],["D","Ой, гость дорогой кушайте, вот фрукты, вот щербет. Али-Баба?"]]},{"c":"Али-Баба","l":[["D","Просим вас, пожалуйста, плов, хороший плов,"],["D","Просто первый раз такой получился."]]},{"c":"Хасан","l":[["L","Ай, хороший плов, ну просто первый раз такой."]]},{"c":"Али-Баба","l":[["L","Зейнаб, лепешки где, что за обман такой?"]]},{"c":"Зейнаб","l":[["L","Простите, гость наш дорогой, Али-Баба такой."],["L","Всегда спешит, всегда бежит, смешной такой!"]]},{"c":"Хасан","l":[["L","Отличный плов, ну просто первый раз такой."],["L","Пойду, схожу во двор, настал момент такой."]]},{"c":"Зейнаб","l":[["L","Эй, нет! У нас закон другой, закон такой,"],["L","Сначала песни, а потом момент любой."],["L","Сначала песни, а потом момент любой"]]},{"c":"А.Б.","l":[["L","Ты что, Зейнаб, а вдруг ему момент такой"]]},{"c":"Зейнаб","l":[["L","Молчи, Али-Баба, услужливый такой."],["L","Сначала песня, а потом момент любой!"]]},{"c":"Хасан","l":[["L","Пойду, схожу во двор, настал момент такой."],["L","Пойду, схожу во двор, настал момент такой"],["L","Отличный плов, ну просто первый раз такой."]]},{"c":"Зейнаб","l":[["L","Эй, нет! У нас закон другой, закон такой,"],["L","Сначала песни, а потом момент любой."]]},{"c":"Али Баба","l":[["P","(ругается)"],["D","Зейнаб, я ничего не понимаю, что происходит, где Фатима?"]]},{"c":"Фатима","l":[["L","Ах, красавец гость, храни тебя Аллах!"],["L","Ах, смотри - еще красивей в зеркалах!"],["L","Ну-ка пойте, я станцую, скажешь \"ах\"!"],["L","Пойте громче, сядьте быстро на коврах!"]]},{"c":"Хасан","l":[["L","А она мне очень очень нравится!"]]},{"c":"Али-Баба","l":[["L","Ну что ты дорогой, она красавица!"]]},{"c":"Хасан","l":[["L","А она мне очень очень нравится!"]]},{"a":"Варшавская А. уводит Хасана"},{"c":"Алена","l":[["P","(возвращается)"],["D","С днем рожденья, дорогой Али-Баба! Ты спасен, и дом спасен,"]]},{"c":"Фатима","l":[["D","Али-Баба! Зверь Хасан у нас в гостях, Али-Баба! Одноглазый атаман, Али-Баба!"]]},{"c":"Зейнаб","l":[["D","Ты спасен и дом спасен, Али-Баба! С днем рождения тебя, Али-Баба!"]]},{"c":"Зейнаб, Фатима","l":[["D","С днем рождения тебя, Али-Баба!"]]}]},{"title":"Сцена 18 · Навруз","blocks":[{"c":"Мустафа","l":[["D","Ах, горы Персии, здесь дружба победила смерть!"],["D","Значит, праздник Навруз наступил, наконец!"],["D","А \"Навруз\" в перев <script>
(function(){
const SC = JSON.parse(document.getElementById('data').textContent);
const Lb='(?<![А-Яа-яЁё])', Rb='(?![А-Яа-яЁё])';
const rx=(s,f)=>new RegExp(s.replace(/\\L/g,Lb).replace(/\\R/g,Rb),f||'');
// kind: char | group | actor. cue: matches speaker name; rem: matches stage directions
const ROLES=[
 {id:'mustafa',n:'Мустафа',k:'char',cue:/мустафа/i,rem:/Мустаф/},
 {id:'si',n:'Собирательница историй',k:'char',cue:rx('собирательница|^си$','i'),rem:rx('Собирательниц|\\LСИ\\R')},
 {id:'ali',n:'Али-Баба',k:'char',cue:/али[- ]?баба|^а\.б\.?$/i,rem:rx('Али[- ]?[Бб]аб|А\\.Б|А-Б|\\LАБ\\R')},
 {id:'zeynab',n:'Зейнаб',k:'char',cue:/зейнаб/i,rem:rx('Зейнаб|(?<![А-ЯЁ][а-яё]+\\s)\\LЗ\\R')},
 {id:'fatima',n:'Фатима',k:'char',cue:/фатима/i,rem:rx('Фатим|(?<![А-ЯЁ][а-яё]+\\s)\\LФ\\R')},
 {id:'kasym',n:'Касым',k:'char',cue:/касым/i,rem:rx('Касым|(?<![А-ЯЁ][а-яё]+\\s)\\LК\\R')},
 {id:'hasan',n:'Хасан (Атаман)',k:'char',cue:/хасан|атаман/i,rem:/Хасан|[Аа]таман/},
 {id:'ahmed',n:'Ахмед',k:'char',cue:/ахме[дт]/i,rem:/Ахме[дт]/},
 {id:'muhammed',n:'Мухаммед',k:'char',cue:/мухаммед/i,rem:/Мухаммед/},
 {id:'suleyman',n:'Сулейман',k:'char',cue:/сулейман/i,rem:/Сулейман/},
 {id:'razb',n:'Разбойники',k:'group',cue:/^разбойник/i,rem:/[Рр]азбойник/,m:['gordins','gordinv','orlov','efimov']},
 {id:'hor',n:'Хор',k:'group',cue:/^хор$/i,rem:/Хор(?! женщин)/,m:['sergienko','alifanov','gusmanov','shmitke','saburova','varshavskaya','bashirova','smykova','gordina','golub','barchuk']},
 {id:'horw',n:'Хор женщин (ВЖ)',k:'group',cue:/хор женщин/i,rem:rx('Хор женщин|\\LВЖ\\R'),m:['saburova','varshavskaya','bashirova','smykova','gordina','golub','barchuk']},
 {id:'bashirova',n:'Баширова Э.',k:'actor',s:'Баширов'},
 {id:'varshavskaya',n:'Варшавская А. (Алена)',k:'actor',s:'Варшавск|Ал[её]на'},
 {id:'smykova',n:'Смыкова А.',k:'actor',s:'Смыков'},
 {id:'barchuk',n:'Барчук В.',k:'actor',s:'Барчук'},
 {id:'golub',n:'Голуб Н.',k:'actor',s:'Голуб'},
 {id:'gordina',n:'Гордина Н.',k:'actor',s:'Гордина'},
 {id:'gordins',n:'Гордин С. (Сергей)',k:'actor',s:'Гордин\\s*С|Сергей'},
 {id:'gordinv',n:'Гордин В. (Влад)',k:'actor',s:'Гор[дл]ин(ым)?\\s*В|\\LВлад\\R'},
 {id:'orlov',n:'Орлов',k:'actor',s:'Орлов'},
 {id:'efimov',n:'Ефимов А. (Антон)',k:'actor',s:'Ефимов|Антон'},
 {id:'sergienko',n:'Сергиенко К.',k:'actor',s:'Сергиенко'},
 {id:'alifanov',n:'Алифанов С.',k:'actor',s:'Алифанов'},
 {id:'gusmanov',n:'Гусманов Т.',k:'actor',s:'Гусманов'},
 {id:'shmitke',n:'Шмитке А.',k:'actor',s:'Шмитке'},
 {id:'saburova',n:'Сабурова А.',k:'actor',s:'Сабуров'},
];
ROLES.forEach(r=>{ if(r.k==='actor'){ r.cue=rx(r.s,'i'); r.rem=rx(r.s); } });
const BY=Object.fromEntries(ROLES.map(r=>[r.id,r]));
const GROUPS=ROLES.filter(r=>r.k==='group');

function cueOwners(c){
  if(!c) return [];
  if(/^все вместе/i.test(c)) return ['*'];
  // a cue naming an actor ("1 мужчина Матвеев Д.") belongs to that actor only
  const actors=ROLES.filter(r=>r.k==='actor'&&r.cue.test(c)).map(r=>r.id);
  if(actors.length) return actors;
  return ROLES.filter(r=>r.k!=='actor'&&r.cue.test(c)).map(r=>r.id);
}
function mentions(t){ return ROLES.filter(r=>r.rem.test(t)).map(r=>r.id); }
function nameOnly(t){ // "(Гойдин Р.)" → ['gojdin']
  const s=t.replace(/[()]/g,'').trim();
  if(s.length>18) return null;
  const a=ROLES.filter(r=>r.k==='actor'&&r.cue.test(s)).map(r=>r.id);
  return a.length?a:null;
}

// annotate
const counts={};
let bid=0;
SC.forEach((sc,si)=>{ sc.blocks.forEach(b=>{
  b.id='b'+(bid++); b.si=si;
  if(b.a!==undefined){ b.men=mentions(b.a); return; }
  const base=cueOwners(b.c); let sub=null; b.own=new Set();
  b.L=b.l.map(([k,t])=>{
    if(k==='P'){ const n=nameOnly(t); if(n){ sub=base.some(o=>BY[o]&&BY[o].k==='group')||!base.length?n:[...new Set([...base,...n])]; return {k,t,own:sub,tag:true}; } return {k,t,own:[],men:mentions(t)}; }
    const own=sub||base; own.forEach(o=>b.own.add(o)); return {k,t,own};
  });
  b.own.forEach(o=>{ counts[o]=(counts[o]||0)+1; });
  // group lines count toward members too
  [...b.own].forEach(o=>{ const g=BY[o]; if(g&&g.m) g.m.forEach(m=>{ if(!b.own.has(m)) counts[m]=(counts[m]||0)+1; }); });
});});

// who is on stage in each scene
SC.forEach(sc=>{ const ids=new Set();
  sc.blocks.forEach(b=>{ (b.men||[]).forEach(i=>ids.add(i)); if(b.own) b.own.forEach(i=>ids.add(i)); (b.L||[]).forEach(x=>{ (x.own||[]).forEach(i=>ids.add(i)); (x.men||[]).forEach(i=>ids.add(i)); }); });
  ids.delete('*');
  const pick=k=>ROLES.filter(r=>r.k===k&&ids.has(r.id)).map(r=>r.n);
  sc.castA=[...pick('char'),...pick('group')]; sc.castB=pick('actor');
});
// state
let st={sel:[],mode:'all',fs:17,hide:false};
try{ const s=JSON.parse(localStorage.getItem('alibaba-script')||'null'); if(s) st=Object.assign(st,s); }catch(e){}
st.sel=(st.sel||[]).filter(i=>BY[i]);
const save=()=>{ try{ localStorage.setItem('alibaba-script',JSON.stringify(st)); }catch(e){} };

function status(owners){
  if(!owners||!owners.length||!st.sel.length) return '';
  if(owners.some(o=>st.sel.includes(o))) return 'mine';
  if(owners.includes('*')) return 'group';
  if(owners.some(o=>BY[o]&&BY[o].m&&BY[o].m.some(m=>st.sel.includes(m)))) return 'group';
  return '';
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function blockHTML(b,lead){
  if(b.a!==undefined){
    const m=status(b.men)?' mention':'';
    return `<div class="blk act${m}${lead?' lead':''}" id="${b.id}">${lead?'<div class="lead-tag">подводка</div>':''}${esc(b.a)}</div>`;
  }
  let h=`<div class="blk${lead?' lead':''}" id="${b.id}">${lead?'<div class="lead-tag">подводка</div>':''}`;
  if(b.c) h+=`<div class="cue">${esc(b.c)}</div>`;
  b.L.forEach(x=>{
    let s=x.k==='P'?(x.tag?status(x.own):(status(x.men)?'':'')) : status(x.own);
    if(x.k==='P') s='';
    const hide=(s==='mine'&&st.hide&&!lead)?' hide':'';
    h+=`<div class="ln ${x.k}${s?' '+s:''}${hide}">${esc(x.t)}</div>`;
  });
  return h+'</div>';
}
function blockHit(b){
  if(b.a!==undefined) return status(b.men)?'m':'';
  return b.L.some(x=>x.k!=='P'&&status(x.own))?'s':'';
}

const out=document.getElementById('out');
function render(){
  document.documentElement.style.setProperty('--fs',st.fs+'px');
  const who=document.getElementById('who');
  who.innerHTML=st.sel.length?esc(st.sel.map(i=>BY[i].n).join(', '))+' <small>· изменить</small>':'Выбрать свою роль';
  const mine=st.mode==='mine'&&st.sel.length;
  document.getElementById('mAll').setAttribute('aria-pressed',String(!mine));
  document.getElementById('mMine').setAttribute('aria-pressed',String(!!mine));
  document.getElementById('mMine').disabled=!st.sel.length;
  document.getElementById('rehRow').hidden=!st.sel.length;
  document.getElementById('hideMine').checked=st.hide;
  document.getElementById('next').hidden=!st.sel.length;

  let h=''; const jump=[];
  let totLines=0,totScenes=0;
  SC.forEach((sc,si)=>{
    const hits=sc.blocks.map(blockHit);
    const n=sc.blocks.filter((b,i)=>hits[i]==='s').reduce((a,b)=>a+b.L.filter(x=>x.k!=='P'&&status(x.own)).length,0);
    if(n||hits.some(Boolean)){ totScenes++; } totLines+=n;
    const tag=st.sel.length?(n?`${n} строк`:(hits.some(Boolean)?'в ремарках':'')):'';
    if(mine&&!hits.some(Boolean)) return;
    jump.push([`s${si}`,sc.title+(tag?' · '+tag:'')]);
    h+=`<section class="scene"><div class="sh" id="s${si}">${esc(sc.title)}<span>${tag}</span></div>`;
    if(sc.castA.length||sc.castB.length) h+=`<div class="cast"><b>Заняты:</b> ${esc(sc.castA.join(', '))}${sc.castB.length?` <span>· ${esc(sc.castB.join(', '))}</span>`:''}</div>`;
    if(!mine){ sc.blocks.forEach(b=>h+=blockHTML(b,false)); }
    else{
      let last=-1;
      sc.blocks.forEach((b,i)=>{
        if(!hits[i]) return;
        let lead=i-1; while(lead>=0&&hits[lead]) lead--;
        if(hits[i]==='s'&&lead>last&&lead>=0&&!hits[lead]&&lead===i-1){
          if(last>=0&&lead>last+1) h+='<div class="gap">···</div>';
          h+=blockHTML(sc.blocks[lead],true); last=lead;
        } else if(last>=0&&i>last+1) h+='<div class="gap">···</div>';
        h+=blockHTML(b,false); last=i;
      });
    }
    h+='</section>';
  });
  if(mine){
    h=`<div class="summary"><b>${esc(st.sel.map(i=>BY[i].n).join(', '))}</b>: ${totLines} строк в ${totScenes} сценах. Перед каждой репликой показана подводка, ремарки с вашим именем подсвечены.</div>`+h;
  } else if(!st.sel.length){
    h=`<div class="summary">Нажмите <b>«Выбрать свою роль»</b> и отметьте персонажа и свою фамилию. Ваши реплики подсветятся, а во вкладке «Моя роль» останутся только они.</div>`+h;
  }
  out.innerHTML=h;
  const j=document.getElementById('jump');
  j.innerHTML='<option value="">Перейти к сцене…</option>'+jump.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('');
}

// sheet
const sheet=document.getElementById('sheet');
function openSheet(){
  const sec=(k,t,p)=>`<h3>${t}</h3>${p?`<p>${p}</p>`:''}<div class="chips">`+ROLES.filter(r=>r.k===k).map(r=>
    `<button type="button" class="chip" data-id="${r.id}" aria-pressed="${st.sel.includes(r.id)}">${esc(r.n)}<small>${counts[r.id]||0}</small></button>`).join('')+'</div>';
  document.getElementById('sheetBody').innerHTML=
    '<p>Можно отметить несколько: персонажа, группу и свою фамилию. Число — сколько раз вы говорите или поёте.</p>'+
    sec('char','Персонажи')+sec('group','Группы','Строки группы подсвечиваются и её участникам.')+sec('actor','Участники','Фамилии, которые стоят в репликах и ремарках.');
  sheet.hidden=false;
}
document.getElementById('sheetBody').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const id=c.dataset.id; const i=st.sel.indexOf(id);
  if(i>=0) st.sel.splice(i,1); else st.sel.push(id);
  c.setAttribute('aria-pressed',String(i<0));
});
document.getElementById('who').onclick=openSheet;
document.getElementById('clearSel').onclick=()=>{ st.sel=[]; sheet.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false')); };
document.getElementById('doneSel').onclick=()=>{ sheet.hidden=true; if(!st.sel.length) st.mode='all'; save(); render(); };
sheet.addEventListener('click',e=>{ if(e.target===sheet) document.getElementById('doneSel').click(); });

document.getElementById('mAll').onclick=()=>{ st.mode='all'; save(); render(); scrollTo(0,0); };
document.getElementById('mMine').onclick=()=>{ if(!st.sel.length) return; st.mode='mine'; save(); render(); scrollTo(0,0); };
document.getElementById('fsUp').onclick=()=>{ st.fs=Math.min(26,st.fs+1); save(); render(); };
document.getElementById('fsDown').onclick=()=>{ st.fs=Math.max(13,st.fs-1); save(); render(); };
document.getElementById('hideMine').onchange=e=>{ st.hide=e.target.checked; save(); render(); };
document.getElementById('jump').onchange=e=>{ const el=document.getElementById(e.target.value); if(el) el.scrollIntoView(); e.target.value=''; };
out.addEventListener('click',e=>{ const l=e.target.closest('.ln.hide'); if(l) l.classList.remove('hide'); });
document.getElementById('next').onclick=()=>{
  const top=document.querySelector('.bar').getBoundingClientRect().bottom+8;
  const els=[...out.querySelectorAll('.blk:not(.lead) .ln.mine, .blk:not(.lead) .ln.group, .act.mention')];
  const nx=els.find(el=>el.getBoundingClientRect().top>top+4);
  (nx||els[0])?.closest('.blk').scrollIntoView();
};
render();
})();
</script>
