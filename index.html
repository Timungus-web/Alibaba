<style>
/* Layout: one reading column, sticky control bar on top; script set like a prompt book — mono cues, serif speech, sans stage directions */
:root{
  --bg:#f4f6f8; --paper:#ffffff; --ink:#1b2030; --muted:#5f6779; --line:#dbe0e7;
  --accent:#0d6d76; --accent-ink:#ffffff;
  --mine:#fff0c2; --mine-bar:#c98a00; --group:#fbf6e6; --mention:#e2f0f1; --cue-bg:#eef1f5;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-text:"PT Serif",Georgia,"Times New Roman",serif;
  --f-mono:"PT Mono","Courier New",ui-monospace,monospace;
  --fs:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141b; --paper:#191d26; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2a3040;
  --accent:#4cbcc4; --accent-ink:#0b1216;
  --mine:#3b3014; --mine-bar:#f0b429; --group:#2a2616; --mention:#163538; --cue-bg:#1f2430; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141b; --paper:#191d26; --ink:#e6e8ee; --muted:#9aa2b3; --line:#2a3040;
  --accent:#4cbcc4; --accent-ink:#0b1216;
  --mine:#3b3014; --mine-bar:#f0b429; --group:#2a2616; --mention:#163538; --cue-bg:#1f2430; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.bar-in{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.title{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.spacer{flex:1}
.who{flex:1;min-width:0;text-align:left;background:var(--cue-bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.who small{color:var(--muted);font-weight:400}
.ibtn{border:1px solid var(--line);background:var(--paper);border-radius:10px;min-width:40px;height:38px;cursor:pointer;padding:0 10px}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:0;background:transparent;padding:8px 12px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.seg button:disabled{opacity:.45;cursor:default}
select.jump{flex:1;min-width:0;border:1px solid var(--line);background:var(--paper);border-radius:10px;height:38px;padding:0 8px}
.chk{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--muted);font-size:14px;cursor:pointer}

main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 120px}
.col{max-width:720px;margin:0 auto}
.summary{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:16px;color:var(--muted)}
.summary b{color:var(--ink)}
.empty{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}

.scene{margin-bottom:28px}
.sh{font-family:var(--f-mono);font-weight:700;font-size:15px;letter-spacing:.08em;padding:18px 0 8px;border-bottom:2px solid var(--ink);margin-bottom:12px;display:flex;justify-content:space-between;gap:8px;scroll-margin-top:120px}
.sh span{font-weight:400;color:var(--muted);letter-spacing:0;font-family:var(--f-ui);font-size:13px}
.blk{margin:0 0 14px;font-size:var(--fs);scroll-margin-top:130px}
.act{font-family:var(--f-ui);font-size:calc(var(--fs) - 2px);color:var(--muted);padding:2px 0}
.act.mention{background:var(--mention);color:var(--ink);border-radius:8px;padding:6px 10px;margin-inline:-10px}
.cue{font-family:var(--f-mono);font-size:calc(var(--fs) - 3px);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ln{font-family:var(--f-text);padding:1px 10px;margin-inline:-10px;border-left:3px solid transparent}
.ln.L{font-style:italic}
.ln.P{font-style:italic;color:var(--muted);font-size:calc(var(--fs) - 2px);padding-left:26px}
.ln.mine{background:var(--mine);border-left-color:var(--mine-bar)}
.ln.group{background:var(--group);border-left-color:var(--mine-bar);border-left-style:dotted}
.ln.mine:first-of-type,.ln.group:first-of-type{border-top-right-radius:6px}
.ln.hide{color:transparent;text-shadow:none;cursor:pointer;position:relative}
.ln.hide::after{content:"нажмите, чтобы открыть";position:absolute;left:12px;top:1px;color:var(--muted);font-family:var(--f-ui);font-style:normal;font-size:13px}
.ln.hide.L::after{content:"♪ нажмите, чтобы открыть"}
.blk.lead{opacity:.62}
.lead-tag{font-family:var(--f-ui);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.gap{text-align:center;color:var(--muted);letter-spacing:.4em;margin:-4px 0 12px;font-size:13px}

.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:12px 18px;font-weight:600;cursor:pointer;box-shadow:0 4px 14px rgb(0 0 0 / .18)}

.sheet{position:fixed;inset:0;z-index:20;background:rgb(10 12 18 / .45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--paper);width:100%;max-width:720px;max-height:86%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{display:flex;align-items:center;gap:8px;padding:14px max(16px,env(safe-area-inset-left,0px)) 10px;border-bottom:1px solid var(--line)}
.sheet-head h2{font-size:17px;margin:0;flex:1}
.sheet-body{overflow:auto;padding:12px max(16px,env(safe-area-inset-left,0px)) 16px}
.sheet-body h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;font-weight:600}
.sheet-body p{margin:0 0 6px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;cursor:pointer;display:flex;gap:6px;align-items:baseline}
.chip small{color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip[aria-pressed="true"] small{color:inherit;opacity:.8}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
</style>

<header class="bar">
  <div class="bar-in">
    <div class="row">
      <span class="title">Али-Баба</span>

</div>

<script id="data" type="application/json">[{"title":"СЦЕНА 1.","blocks":[{"a":"(Мустафа, СИ, Островская Н., Матвеев Д., Самойлов Д., Смыкова А., Гойдин Р., Сидорова О., Казанцева И., Рыжкова С., Сергиенко Н., Юмин С, Качалкина М., Елагина Л., Честных К., Самодурова Ю.)"},{"a":"Мустафа выходит, садится. чинит башмак, Островская Н. выходит, стучит в барабан, Матвеев Д. выходит, ему жарко, ложится на стул, накрытый покрывалом. Из-за кулис подходит Самойлов Д., забирает ботинок, обувается, встает. СИ оглядываясь, выходит на сцену."},{"c":"Собирательница Историй","l":[["D","Скажи мне, почтенный сапожник, не тебя ли зовут Мустафой, который знает про всё на свете?"]]},{"c":"Мустафа","l":[["P","(чинит башмак)"],["D","Ах, любезная прохожая, я и был таким Мустафой, которого знал весь персидский базар, как такого Мустафу, который знает про всё на свете, но теперь...У тебя что, отвалилась подошва от башмака?"]]},{"a":"СИ смотрит на свою подошву, говорит- нет…"},{"c":"Мустафа","l":[["D","Тогда... Проходи мимо, дай мне спокойно починить этот каблук."]]},{"c":"Собирательница Историй","l":[["D","Я хожу по вашей стране и собираю сказки и истории."]]},{"a":"Во время разговора Самойлов Д. расталкивает спящего. Он не просыпается. Островская Н. стучит ему над ухом, то над одним, то над другим. Ничего не выходит. Садится и продолжает стучать. Тогда из-за кулис выходит Гойдин Р., поднимает спящего с Самойловым Д. и они уводят его за кулисы"},{"c":"Собирательница Историй","l":[["D","Почтенный сапожник Мустафа, мудрейший Али-Баба, с которым меня cвёл случай, посоветовал мне послушать твой рассказ про мудрейшего Али-Бабу"],["P","(барабан перестает стучать)"],["D","…про его брата Касыма"],["P","(дробь)"],["D","...и сорок каких-то разбойников"]]},{"c":"Мустафа","l":[["P","(встает)"],["D","Так!"]]},{"c":"Собирательница историй","l":[["D","Никому в мире он не доверит своей истории так, как доверяет её почтенному Мустафе. Так сказал Али-Баба."]]},{"c":"Мустафа","l":[["D","Вах! Тогда садись"]]},{"a":"Казанцева И. выносит циновку, потом забирает табурет и уносит его, Смыкова А. вазу с фруктами на голове и ставит перед СИ, Островская Н. уходит за кулисы"},{"c":"Мустафа","l":[["D","я буду говорить, а ты будешь слушать! Итак, Персия!"]]},{"a":"Поют песню вместе со всеми, потом отходят вправо"},{"a":"Хор (песня и танец): 2 мужчины, Сергиенко К., Юмин С, и 4 женщины. Качалкина М, Елагина Л, Честных К, Самодурова Ю."},{"c":"Хор","l":[["L","Персия, Персия, Персия, Персия"],["L","Персия, Персия, Персия, Персия"],["L","А-а-а-а, А-а-а-а, А-а-а-а, А-а-а-а."],["L","Здравствуйте сегодня, здравствуйте всегда,"],["L","Здравствуй, кто угодно, подходи сюда!"],["L","Персия, Персия - фруктовый рай,"],["L","Персидские персики, зеленый чай."],["L","Если я, если я родился здесь,"],["L","Персия, Персия - страна чудес."],["L","Персия, Персия - фруктовый рай,"]]},{"c":"Казанцева И","l":[["D","Персидские шали!"]]},{"c":"Хор","l":[["L","Персидские персики, зеленый чай."]]},{"c":"Сидорова О.","l":[["D","Расписные ковры!"]]},{"c":"Хор","l":[["L","Персия, Персия - словно в раю,"]]},{"c":"Смыкова А.","l":[["D","Здесь трали-вали, здесь женщин не видали"]]},{"c":"Хор","l":[["L","Честное, честное слово даю!"]]},{"c":"Рыжкова С.","l":[["D","Потому что чёрные чадры!"]]},{"a":"Голоса в проигрыше."},{"c":"Сергиенко К","l":[["D","Ты думаешь, я бедный и голодный, и потому худой?"]]},{"c":"Юмин С.","l":[["D","А Мустафа такой бедняк безродный - он потому худой?"]]},{"c":"Хор","l":[["L","Нет, нет, нет! Ошибаешься! Вот, вот, вот: убеждаешься!"],["L","Этот вот персидский, но простой народ"],["L","Очень много силы песням отдает,"],["L","Целый день поет он и танцует, вот!"],["L","Вот за что мы очень, вот такой народ!"],["L","Персия, Персия - страна чудес. Если я, если я родился здесь,"],["L","С песнею, с песнею теряю вес! Персия, Персия, Персия, Персия,"],["L","Персия, Персия, мой папа - перс!"]]},{"a":"Уходят Хор и Али-Баба за кулисы, Хасан в класс ВМ. Остаются рассказчицы Казанцева И. Сидорова О. Рыжкова С. Смыкова А."},{"c":"Казанцева И.","l":[["L","Однажды теплым светлым утром на базаре"],["L","Такую людям злую новость рассказали:"]]},{"c":"Сидорова О.","l":[["L","У Али и Касыма, двух братьев родных,"],["L","Умер старый отец, умер добрый отец, рассказали."]]},{"c":"Рыжкова С.","l":[["L","Брат Касым,"]]},{"a":"Касым выходит сзади, кладет из воздуха деньги в карман"},{"c":"Рыжкова С.","l":[["L","старший брат, стал наследство копить:"],["L","Торговать, покупать, прибавлять и растить, рассказали."]]},{"c":"Сидорова О.","l":[["L","Младший Али-Баба (выпрыгивает сзади) стал дарить, угощать,"],["L","Все гостям раздавать, бедняков баловать, рассказали"]]},{"a":"Касым и Али-Баба здороваются «Салам алейкум»"},{"c":"Рыжкова С.","l":[["L","За Касыма женой отдал дочь Фатиму"]]},{"a":"Фатима выходит, жест руками вверх, хватает Касыма за руки, уводит за кулисы"},{"c":"Рыжкова С.","l":[["L","Отдал главный судья и в придачу дворец, рассказали."]]},{"c":"Смыкова А.","l":[["L","В жены Али-Баба взял подругу Зейнаб"]]},{"a":"Зейнаб выходит к Али- Бабе."},{"c":"Смыкова А.","l":[["L","Им на свадьбу кувшин отдал бедный отец"]]},{"a":"из кулис выходит с кувшином Гуськов Д., наряженный в деда в солнечных очках и уходит за кулисы"},{"c":"Смыкова А.","l":[["L","Рассказали! Рассказали!"]]},{"c":"Сидорова","l":[["D","Вот так, одному кувшин, а другому дворец."]]},{"c":"Казанцева","l":[["D","Да…да.."]]},{"a":"Все ушли за кулисы. На сцене СИ и Мустафа. Гуськов Д., Гойдин Р., Матвеев Д. выходят, садятся по турецки, как бы беседуют."},{"c":"Собирательница Историй","l":[["D","Ага! Почтенный Мустафа, значит богатство сделало старшего Касыма жадным и злым?"]]},{"c":"Мустафа","l":[["D","Ты правильно поняла, но ты неправильно перебиваешь историю. На востоке все решает солнце. Может быть, о жарком нашем климате и любили поговорить красавица Зейнаб и её Али-Баба."]]}]},{"title":"СЦЕНА 2.","blocks":[{"a":"(Зейнаб, Али-Баба, Рыжкова С., Сидорова О., Казанцева И., Смыкова А., Хасан, Гуськов Д., Гойдин Р., Матвеев Д., Поправка Ж.)"},{"a":"Мустафа провожает СИ, идет к мужчинам и садится с ними. А.Б и З. выходят из кулис и поют. КрУгом сидят Гуськов Д., Гойдин Р. Матвеев Д.. и Мустафа. Один Гуськов Д. встает и начинает махать опахалом на поющих, на зрителей. Во время пения Казанцева И красиво выходит с кувшином на плече и медленно наливает сидящим чай"},{"a":"Зейнаб, Али-Баба:"},{"c":"Зейнаб","l":[["L","На Востоке простор,"],["L","Над простором шатер, Над седой шапкой гор"],["L","Гордо-синий ковер, Но очень жарко."]]},{"c":"Али-Баба","l":[["L","Можно ткать,"]]},{"c":"1 мужчина Матвеев Д.","l":[["L","можно шить,"]]},{"c":"2 мужчина Гуськов Д.","l":[["L","Можно трубку курить,"]]},{"c":"3 мужчина Гойдин Р.","l":[["L","Можно жить-не тужить,"]]},{"c":"Зейнаб, Али-Баба","l":[["L","И друг друга любить,"]]},{"c":"Все вместе","l":[["P","(кто находится на сцене)"],["L","Но очень жарко."]]},{"c":"Али-Баба и Зейнаб","l":[["L","На Востоке живешь, в гости друга зовешь,"],["L","На Востоке живешь, весь базар позовешь,"],["L","Наш обычай хорош, Но очень жарко."],["L","Постареешь - поймёшь: Жарко жить, а умрёшь"],["L","- Ай-ай-ай-ай! Очень жалко!"]]},{"a":"З и А-Б разговаривают, расходятся Гуськов Д., Гойдин Р., Матвеев Д., на ходу говорят свои слова и идут в заднюю дверь. Мустафа уходит за кулисы"},{"c":"Мустафа","l":[["D","Хорошо смеяться, когда совесть чистая!"]]},{"c":"Зейнаб","l":[["D","Хорошо веселиться,"]]},{"c":"Али-Баба","l":[["D","когда семья счастливая!"]]},{"c":"Матвеев Д.","l":[["D","Ай, хорошо смеяться, когда в доме шаром покати:"]]},{"c":"Гойдин Р","l":[["D","Последнюю рисинку последнего плова гости доели."]]},{"c":"Гуськов Д.","l":[["D","Али-Баба и Зейнаб с голодухи помрут. Вах!"]]},{"a":"Разбойники ушли в заднюю дверь, остались З и А-Б."},{"c":"Зейнаб","l":[["D","Твои руки, лишь, и голова нас спасут!"]]},{"c":"Али-Баба","l":[["D","И это будет сегодня! Ничего, Зейнаб, пойду, я в лес."]]},{"a":"Зейнаб уходит за кулисы, АБ ходит по лесу"},{"a":"Из кулис выходят:"},{"c":"Рыжкова С","l":[["L","Ах, горы Персии, солнечный край! Леса густые - ходи и наблюдай."]]},{"c":"Казанцева И.","l":[["L","Ходил Али-Баба, рубил и напевал."],["L","Вдруг, чей-то топот, шепот, всадников привал."]]},{"c":"Сидорова О.","l":[["L","Эта быль, уже не быль, а небыль:"],["L","Вдоль ущелья только пыль до неба."]]},{"c":"Смыкова А.","l":[["L","Там, где за день двух людей не встретил"],["L","От людей и лошадей ужасный ветер."]]},{"a":"ушли за кулисы"},{"c":"Али-Баба","l":[["L","Сорок конных безобразных ураган,"],["L","Впереди их одноглазый атаман!"]]},{"a":"А-Б мечется по сцене, потом испуганно прячется в кулисы и смотрит оттуда. Свист из задней двери, летит мешок, выходит Ени, вешает мешок на плечо, вылетает второй мешок, за ним выползает Гуськов Д, берет мешок, потом выходят остальные разбойники, дерутся, машут ногами. Атаман кричит из класса ВМ"},{"c":"Атаман","l":[["D","С коней слезай! …Мешки выгружай!….У пещеры становись!!! По порядку назовись!"]]},{"c":"Разбойники","l":[["P","(Гойдин)"],["D","Первый!"],["P","(Ени)"],["D","Пятый!"],["P","(Матвеев)"],["D","Тридцать пятый!"]]},{"a":"Атаман выходит (величественно с, обращенными к небу, руками.)"},{"c":"Атаман","l":[["D","Сороковой я, Хасан!"]]},{"a":"Разбойники в это время склоняют головы"},{"c":"Атаман","l":[["D","Разбойники, стройся! Сим-Сим, Сезам, откройся! Мешки в пещеру заноси!"]]},{"a":"оставили мешки в пещере, выходят оттуда, Хасан их проверяет, раздает им мечи"},{"c":"Атаман","l":[["D","Сим-Сим, Сезам, закройся."]]},{"c":"Атаман","l":[["D","Нас мало, но каждый из нас стоит десятка отважных разбойников."]]},{"a":"(минус)"},{"c":"Разбойники","l":[["L","Снова кони, пыль и ураган."],["P","(ноги в стороны, локти вверх-вниз)"],["L","Вместе с нами одноглазый атаман."]]},{"a":"Вступление (рука вверх с мечом., нога вперед)"},{"c":"Разбойники","l":[["L","Мы бесшумная команда (шаг вперед, шаг назад), Злая банда атамана"],["P","(шаг вперед, шаг назад)"],["L","Шито-крыто, крыто-шито"],["P","(меч в сторону, потом в другую)"],["L","вах!"],["P","(руки вверх)"],["L","Мы воды в реке не мутим: Убиваем, а не шутим!"],["P","(рок эн ролл)"],["L","Шуто-круто (шаг вперед боком), круто-шуто (еще шаг вперед боком) вах!"],["P","(ножи к горлу)"],["L","Что награбим - сохраним."],["P","(скрещивают руки над головой)"],["L","Все укроет грот Сим-Сим!"],["P","(медленно опускают руки)"]]},{"a":"Атаман в это время ходит впереди и медленно водит мечом перед зрителями"},{"c":"Разбойники","l":[["L","Четко, кротко, кротко, четко, вах!"]]},{"a":"Машут мечами кто во что горазд."},{"c":"Разбойники","l":[["L","Ваши важные горшки Быстро прячем мы в мешки"],["P","(мечами влево, вправо)"],["L","Шатко, кратко, кратко, шатко (колени танцуют), вах!"],["P","(ножи к горлу Атаману)"],["L","Мы бесшумная команда, Злая банда атамана."],["P","(двое меняются местами)"],["L","Шито-крыто, крыто-шито (двое меняются местами), вах!"],["L","Что награбим - сохраним."],["P","(один машет шашкой сзади, на слог НИМ присели)"],["L","Все укроем в грот Сим-Сим."],["P","(на слог СИМ Атаман на ноги двум)"],["L","Четко, кротко, кротко, четко, вах!"]]},{"a":"на последние слова убегают с криками в заднюю дверь"},{"c":"Али-Баба","l":[["P","(выходит из-за кулисы)"],["P","(минус)"],["L","Ну что ты потеряешь, Если все узнаешь?"],["L","Сим-Сим, откройтесь, будьте так добры!"]]},{"a":"Сим-Сим открывается, А.Б. заходит"},{"c":"Али-Баба","l":[["L","Ах, спасибо, награди тебя Аллах!"],["L","Ах, смотрите все в коврах, зеркалах!"],["L","Копья, шлемы, ах, кинжалы, ах, мечи!"],["L","Что в кастрюлях? Плов? Вкусней, чем ел Аллах!"],["L","Моя бедная Зейнаб, не видишь ты,"],["L","Я возьму тебе немного, скажешь, \"ах\"!"],["L","Вот я взял, незаметно сколько взял,"],["L","Даже стало еще больше в зеркалах,"],["P","(выходит)"],["L","Все глаза устали, сыт я и устал."],["L","Завтра утром накормлю я весь базар."],["L","Но ни звука о Сим-Сим и зеркалах."]]},{"a":"АБ уходит в класс ВМ"},{"c":"Зейнаб","l":[["P","(выходи из-за кулис)"],["L","Спустилось солнце два часа тому назад."],["L","Ушел мой муж и не вернулся он назад!"],["L","Куда бежать, Али-Баба? Вперед? Назад?"],["L","Спустилось солнце два часа тому назад."],["L","Кто нам поможет, беднякам, где силы взять?"],["L","Аллах высоко, а султан - где денег взять?"],["L","Что делать, помощь Персии, ни дать, ни взять?"],["L","Кто нам поможет, беднякам, где силы взять?"],["L","В горах давным-давно черным-черно, наверно!"],["L","А во дворцах спит каждое окно, наверно!"],["L","Али-Бабу съел дикий волк давно, наверно!"],["L","В горах давным-давно черным-черно, наверно!"],["L","А во дворцах спит каждое окно, наверно."],["L","В горах давным-давно черным-черно, наверно."],["L","Али-Бабу съел дикий волк давно, наверно."]]},{"c":"Али-баба","l":[["P","(выбегает из класса ВМ)"],["D","Помолчи, Зейнаб!"],["L","Иди сюда, гляди сюда, молчи!"],["L","Налей мне чай и помогай, молчи!"],["L","Тише ресницами моргай, молчи!"],["L","Султан услышит - и прощай, молчи!"],["L","Динары в землю засыпай, молчи!"]]},{"c":"Зейнаб","l":[["P","(обиженно)"],["D","Ты слова правды не сказал своей Зейнаб."]]},{"a":"Смыкова А. выходит из кулис, напевает во время разговора З и А-Б, как будто подслушивает."},{"c":"Али-Баба","l":[["L","Ах, варенный я ишак Три уха набекрень!"],["L","Ах, бумажный я кушак, Тюфяк, корявый пень."],["L","Слушай, слушай, слушай!"]]},{"a":"уходят в класс ВМ"}]},{"title":"СЦЕНА 3","blocks":[{"a":"(Смыкова А., Зейнаб, Фатима, Казанцева И)"},{"c":"Смыкова А.","l":[["P","(Когда они уходят, говорит свои слова.)"],["D","Прошла ночь, солнце выспалось, небеса проснулись, разогрелось утро..."]]},{"a":"Уходит за кулисы"},{"c":"Зейнаб","l":[["P","(выходит из класса ВМ)"],["L","Без счета наше золото в земле лежит,"],["L","От страха все дрожит, ой, надо торопиться!"],["P","(зовет)"],["D","Эй, Фатима, а Фатима!"]]},{"a":"Ф. выбегает из-за кулис"},{"a":"минус"},{"c":"Зейнаб","l":[["L","Вот есть крупа, а мерки нет,"],["L","Но есть крупа, вот, Фатима,"],["L","а мерки мерить, значит, нет!"],["L","Хотя крупы... есть, Фатима. И даже много!"],["L","Мерки нет! Ты дашь мне мерку, Фатима?"]]},{"c":"Фатима","l":[["L","Вах, много слов, зачем так много треска,"],["L","Ты мне невестка или не невестка?"],["L","Здесь во дворе постой, а в дом не заходи,"],["L","Ты мне невестка или не невестка?"],["L","Циновки в доме чистые, Зейнаб."],["L","Не знаю, ноги мыла ли, невестка?"],["L","Циновки чистые, а мерка там,"],["L","Там в дальней комнате, постой, невестка."],["L","\"Крупы не сосчитать!\" Ну и невестка!"],["L","Мы медом кое-где пометим мерку."],["L","Посмотрим вечером, что даст проверка."],["L","\"Крупы не сосчитать!\" Ну и невестка!"]]},{"c":"Зейнаб","l":[["L","Зачем так много слов, так много треска?"],["L","Я ей невестка или не невестка? Циновки ее чище моих ног! Подумаешь, циновная невестка!"],["L","Мы бедняки, но чище наших ног"],["L","Не видел ваш порог, любезная невестка!"]]},{"a":"минус"},{"c":"Фатима","l":[["L","Вот мерка для крупы твоей проверка."],["L","Верни мне к вечеру, привет Али-Бабе!"],["L","Касым летает целый день как беркут,"],["L","Давно не виделись, привет Али-Бабе!"],["L","Верни мне к вечеру, ты слышишь, мерку."],["L","И в гости... как-нибудь... Скажи Али-Бабе:"],["L","Храни Аллах тебя! Прощай, единоверка!"]]},{"c":"Зейнаб","l":[["L","Касыму наш поклон!"]]},{"c":"Фатима","l":[["L","Привет Али-Бабе!"]]},{"a":"З. уходит в класс ВМ"},{"c":"Фатима","l":[["D","Посмотрим вечером, что даст моя проверка"]]},{"a":"остается на сцене, занимается делами."},{"c":"Фатима","l":[["P","(стук в дверь)"],["D","Кто там? Зейнаб?"]]},{"c":"Зейнаб","l":[["D","Я, Фатима. Возьми назад, благодарю, бегу домой, Кипит похлебка на огне, спасибо, Фатима!"]]},{"a":"ушла в класс ВМ"},{"c":"Фатима","l":[["D","Вах, много слов, зачем так много треска?"],["D","Ты мне невестка или не невестка?"]]},{"c":"Казанцева И","l":[["P","(со сцены)"],["D","Эта поспешила, убежала, Мерку та схватила, вся дрожала. И заплакала богачка в тишине:"]]},{"a":"ушла за кулисы"},{"c":"Фатима","l":[["D","Золото сверкает на медовом дне!"]]},{"a":"села, зарыдала"}]},{"title":"СЦЕНА 4.","blocks":[{"a":"(Касым, Фатима, Али-Баба, Мустафа)"},{"a":"Входит Касым из-за кулис"},{"c":"Касым","l":[["D","Зачем эти слезки испортили глазки, Фатима?"],["D","Ушел вечер плова, настал вечер ласки, Фатима!"]]},{"c":"Фатима","l":[["D","Ах, нищий! Скорей позабудь все дары."]]},{"c":"Касым","l":[["D","Ммм, Фатима."]]},{"c":"Фатима","l":[["D","Твой брат на горе, ты башмак у горы."]]},{"c":"Касым","l":[["D","Гмм, эй, жена, Аллаха моли, чтоб тебя не побил, женщина!"]]},{"c":"Фатима","l":[["D","Твой братец Али тебя перехитрил!"]]},{"c":"Касым","l":[["D","А? Женщина!"]]},{"c":"Фатима","l":[["D","Ты самый умный, Касым, ты как золото считаешь, Касым?"]]},{"c":"Касым","l":[["D","Пальцами, перстами."]]},{"c":"Фатима","l":[["D","А если много золота, ты как считаешь?"]]},{"c":"Касым","l":[["D","Вах! Вах! Ладонями, горстями."]]},{"c":"Фатима","l":[["D","А брат твой бедный, чем, как ты считаешь?"]]},{"c":"Касым","l":[["D","Хэ-хэ!! Дурацкими мечтами!"]]},{"c":"Фатима","l":[["D","Нет, ошибаешься,"],["P","(толкает, одевает таз на голову)"],["D","Мерками, ведрами, горшками!"]]},{"c":"Касым","l":[["D","Стой, Фатима, куда ты? Подожди! Подожди, куда ты так быстро? Ну, помедленнее, Фатима, подожди! Мама! Бабушка! Прабабушка!"]]},{"c":"Фатима","l":[["P","(поет)"],["L","Стой, не хнычь! Слушай речь! Хватит болтовню толочь,"],["L","А даю тебе ночь: Думай, как себе помочь!"],["L","А не придумаешь помочь - Ухожу навеки прочь!"],["L","Даю тебе честное слово, Персидское честное слово,"],["L","Не будь я судейская дочь! Я стану циновки сушить,"],["L","Я стану Али-Баба богатству служить!"],["L","Я стану двоюродной женой или рабыней"],["L","Великого Али-Баба-Баба-Бабыни!"],["L","А ты будешь вечно смешон, И лавки и этого дома лишен,"],["L","О, я несчастнейшая из персидских жён!"],["L","Прочь, Касым, прочь! Я даю тебе ночь:"],["L","Думай, как себе помочь! А не придумаешь помочь -"],["L","Ухожу навеки прочь! Даю тебе честное слово,"],["L","Персидское честное слово. Не будь я судейская дочь!"]]},{"a":"уходит за кулисы, Касым бежит за Ф."},{"a":"Али-Баба выходит из класса ВМ, чистит таз у себя во дворе. Приходит Касым из кулис ножом."},{"c":"Али-Баба","l":[["D","Салям алейкум, здрасте, Касым, мой старший брат! Как сей восход прекрасен, так тебе я рад! Как говорила наша бабушка, кто обидел эти маленькие глазки?"]]},{"c":"Касым","l":[["D","Признавайся, ворон старый, Где украл свои динары!"],["D","Честное персидское слово Я тебя зарежу!!!"]]},{"c":"Али-Баба","l":[["D","Слушай ворон новый, Слушай брат-невежа"],["D","Мне нечего скрывать, Я не умею воровать…"],["D","Это правда, это факт. Слушай, вышло это так..."]]},{"a":"уходят за кулисы"},{"c":"Мустафа","l":[["P","(высовывается из-за кулис)"],["D","Брат брату правду всю сказал."],["D","Про дверь и про Сим-Сим, Про все, что было с ним."]]},{"a":"К и Ф выходят из-за кулис, беседуют по секрету, в стороне встают, посмотрели на зрителей, которые их подслушивают, отошли в другую сторону"},{"c":"Касым","l":[["P","(Фатиме)"],["D","Десять мулов по два сундука: не мало будет? Напомни брату - дома пусть сидит,"],["D","За мной пусть не следит, Не то как звать его забудет!"]]},{"c":"Фатима","l":[["D","Ты сам-то не забудь сказать слова,"],["D","Ведь дверь-то может не открыться!"]]},{"c":"Касым","l":[["D","Ой, ой, как кружится голова,"],["D","Ой, ой, как голова кружится!"]]},{"a":"прощаются Ф. уходит за кулисы"}]},{"title":"СЦЕНА 5.","blocks":[{"a":"(Касым и Разбойники)"},{"a":"Пошел. Заглядывает в разные стороны, ищет пещеру."},{"c":"Касым","l":[["L","Тяжелым будет путь до погребов,"],["L","Когда на город с гор наляжет тьма,"],["L","Жди золотого мужа, Фатима! Ох!"],["L","Ох, все мне и никаких Алибабов!"],["P","(Присел)."],["L","Ой, устал! Что теперь?"],["L","Между скал – Дверь"],["P","(обрадовался)"],["L","Эй, Сим-сим - откройся!"]]},{"a":"Сим-Сим открывается"},{"c":"Касым","l":[["L","Ой, ой, ой! Ах, смотрите - все в коврах!"],["L","Ах, смотрите - в зеркалах!"],["L","Сокровища, с йники","l":[["D","- Уй! - Ай! - Ой!"]]},{"a":"Из-за кулис выходят А-Б и Хасан. С ними Зейнаб, стелет коврик, еду."},{"c":"Зейнаб","l":[["P","(подходит к ним, угощает)"],["D","Ой, гость дорогой кушайте, вот фрукты, вот щербет. Али-Баба?"]]},{"c":"Али-Баба","l":[["D","Просим вас, пожалуйста, плов, хороший плов,"],["D","Просто первый раз такой получился."]]},{"c":"Хасан","l":[["L","Ай, хороший плов, ну просто первый раз такой."]]},{"c":"Али-Баба","l":[["L","Зейнаб, лепешки где, что за обман такой?"]]},{"c":"Зейнаб","l":[["L","Простите, гость наш дорогой, Али-Баба такой."],["L","Всегда спешит, всегда бежит, смешной такой!"]]},{"c":"Хасан","l":[["L","Отличный плов, ну просто первый раз такой."],["L","Пойду, схожу во двор, настал момент такой."]]},{"c":"Зейнаб","l":[["L","Эй, нет! У нас закон другой, закон такой,"],["L","Сначала песни, а потом момент любой."],["L","Сначала песни, а потом момент любой"]]},{"c":"А.Б.","l":[["L","Ты что, Зейнаб, а вдруг ему момент такой"]]},{"c":"Зейнаб","l":[["L","Молчи, Али-Баба, услужливый такой."],["L","Сначала песня, а потом момент любой!"]]},{"c":"Хасан","l":[["L","Пойду, схожу во двор, настал момент такой."],["L","Пойду, схожу во двор, настал момент такой"],["L","Отличный плов, ну просто первый раз такой."]]},{"c":"Зейнаб","l":[["L","Эй, нет! У нас закон другой, закон такой,"],["L","Сначала песни, а потом момент любой."]]},{"c":"Али Баба","l":[["P","(ругается)"],["D","Зейнаб, я ничего не понимаю, что происходит, где Фатима?"]]},{"c":"Фатима","l":[["L","Ах, красавец гость, храни тебя Аллах!"],["L","Ах, смотри - еще красивей в зеркалах!"],["L","Ну-ка пойте, я станцую, скажешь \"ах\"!"],["L","Пойте громче, сядьте быстро на коврах!"]]},{"c":"Хасан","l":[["L","А она мне очень очень нравится!"]]},{"c":"Али-Баба","l":[["L","Ну что ты дорогой, она красавица!"]]},{"c":"Хасан","l":[["L","А она мне очень очень нравится!"]]},{"a":"Фатима уводит Хасана"},{"c":"Фатима","l":[["P","(возвращается)"],["D","Разбойник... покойник! Все! С днем рожденья, д <script>
(function(){
const SC = JSON.parse(document.getElementById('data').textContent);
const Lb='(?<![А-Яа-яЁё])', Rb='(?![А-Яа-яЁё])';
const rx=(s,f)=>new RegExp(s.replace(/\\L/g,Lb).replace(/\\R/g,Rb),f||'');
// kind: char | group | actor. cue: matches speaker name; rem: matches stage directions
const ROLES=[
 {id:'mustafa',n:'Мустафа',k:'char',cue:/мустафа/i,rem:/Мустаф/},
 {id:'si',n:'Собирательница историй',k:'char',cue:rx('собирательница|^си$','i'),rem:rx('Собирательниц|\\LСИ\\R')},
 {id:'ali',n:'Али-Баба',k:'char',cue:/али[- ]?баба|^а\.б\.?$/i,rem:rx('Али[- ]?[Бб]аб|А\\.Б|А-Б|\\LАБ\\R')},
 {id:'zeynab',n:'Зейнаб',k:'char',cue:/зейнаб/i,rem:rx('Зейнаб|\\LЗ\\R')},
 {id:'fatima',n:'Фатима',k:'char',cue:/фатима/i,rem:rx('Фатим|\\LФ\\R')},
 {id:'kasym',n:'Касым',k:'char',cue:/касым/i,rem:rx('Касым|\\LК\\R')},
 {id:'hasan',n:'Хасан (Атаман)',k:'char',cue:/хасан|атаман/i,rem:/Хасан|[Аа]таман/},
 {id:'ahmed',n:'Ахмед',k:'char',cue:/ахмед/i,rem:/Ахме[дт]/},
 {id:'muhammed',n:'Мухаммед',k:'char',cue:/мухаммед/i,rem:/Мухаммед/},
 {id:'suleyman',n:'Сулейман',k:'char',cue:/сулейман/i,rem:/Сулейман/},
 {id:'razb',n:'Разбойники',k:'group',cue:/^разбойник/i,rem:/[Рр]азбойник/,m:['gojdin','eni','matveev','guskov','samojlov']},
 {id:'hor',n:'Хор',k:'group',cue:/^хор$/i,rem:/Хор(?! женщин)/,m:['sergienko','yumin','kachalkina','elagina','chestnyh','samodurova']},
 {id:'horw',n:'Хор женщин (ВЖ)',k:'group',cue:/хор женщин/i,rem:rx('Хор женщин|\\LВЖ\\R'),m:['kachalkina','elagina','chestnyh','samodurova']},
 {id:'kazanceva',n:'Казанцева И.',k:'actor',s:'Казанцев'},
 {id:'sidorova',n:'Сидорова О.',k:'actor',s:'Сидоров'},
 {id:'ryzhkova',n:'Рыжкова С.',k:'actor',s:'Рыжков'},
 {id:'smykova',n:'Смыкова А.',k:'actor',s:'Смыков'},
 {id:'ostrovskaya',n:'Островская Н.',k:'actor',s:'Островск'},
 {id:'matveev',n:'Матвеев Д.',k:'actor',s:'Матвеев'},
 {id:'gojdin',n:'Гойдин Р.',k:'actor',s:'Гойдин'},
 {id:'guskov',n:'Гуськов Д.',k:'actor',s:'Гуськов'},
 {id:'samojlov',n:'Самойлов Д.',k:'actor',s:'Самойлов'},
 {id:'eni',n:'Ени',k:'actor',s:'\\LЕни\\R'},
 {id:'sergienko',n:'Сергиенко',k:'actor',s:'Сергиенко'},
 {id:'yumin',n:'Юмин С.',k:'actor',s:'Юмин'},
 {id:'kachalkina',n:'Качалкина М.',k:'actor',s:'Качалкин'},
 {id:'elagina',n:'Елагина Л.',k:'actor',s:'Елагин'},
 {id:'chestnyh',n:'Честных К.',k:'actor',s:'Честных'},
 {id:'samodurova',n:'Самодурова Ю.',k:'actor',s:'Самодуров'},
 {id:'popravka',n:'Поправка Ж.',k:'actor',s:'Поправк'},
];
ROLES.forEach(r=>{ if(r.k==='actor'){ r.cue=rx(r.s,'i'); r.rem=rx(r.s); } });
const BY=Object.fromEntries(ROLES.map(r=>[r.id,r]));
const GROUPS=ROLES.filter(r=>r.k==='group');

function cueOwners(c){
  if(!c) return [];
  if(/^все вместе/i.test(c)) return ['*'];
  // a cue naming an actor ("1 мужчина Матвеев Д.") belongs to that actor only
  const actors=ROLES.filter(r=>r.k==='actor'&&r.cue.test(c)).map(r=>r.id);
  if(actors.length) return actors;
  return ROLES.filter(r=>r.k!=='actor'&&r.cue.test(c)).map(r=>r.id);
}
function mentions(t){ return ROLES.filter(r=>r.rem.test(t)).map(r=>r.id); }
function nameOnly(t){ // "(Гойдин Р.)" → ['gojdin']
  const s=t.replace(/[()]/g,'').trim();
  if(s.length>18) return null;
  const a=ROLES.filter(r=>r.k==='actor'&&r.cue.test(s)).map(r=>r.id);
  return a.length?a:null;
}

// annotate
const counts={};
let bid=0;
SC.forEach((sc,si)=>{ sc.blocks.forEach(b=>{
  b.id='b'+(bid++); b.si=si;
  if(b.a!==undefined){ b.men=mentions(b.a); return; }
  const base=cueOwners(b.c); let sub=null; b.own=new Set();
  b.L=b.l.map(([k,t])=>{
    if(k==='P'){ const n=nameOnly(t); if(n){ sub=base.some(o=>BY[o]&&BY[o].k==='group')||!base.length?n:[...new Set([...base,...n])]; return {k,t,own:sub,tag:true}; } return {k,t,own:[],men:mentions(t)}; }
    const own=sub||base; own.forEach(o=>b.own.add(o)); return {k,t,own};
  });
  b.own.forEach(o=>{ counts[o]=(counts[o]||0)+1; });
  // group lines count toward members too
  [...b.own].forEach(o=>{ const g=BY[o]; if(g&&g.m) g.m.forEach(m=>{ if(!b.own.has(m)) counts[m]=(counts[m]||0)+1; }); });
});});

// state
let st={sel:[],mode:'all',fs:17,hide:false};
try{ const s=JSON.parse(localStorage.getItem('alibaba-script')||'null'); if(s) st=Object.assign(st,s); }catch(e){}
const save=()=>{ try{ localStorage.setItem('alibaba-script',JSON.stringify(st)); }catch(e){} };

function status(owners){
  if(!owners||!owners.length||!st.sel.length) return '';
  if(owners.some(o=>st.sel.includes(o))) return 'mine';
  if(owners.includes('*')) return 'group';
  if(owners.some(o=>BY[o]&&BY[o].m&&BY[o].m.some(m=>st.sel.includes(m)))) return 'group';
  return '';
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function blockHTML(b,lead){
  if(b.a!==undefined){
    const m=status(b.men)?' mention':'';
    return `<div class="blk act${m}${lead?' lead':''}" id="${b.id}">${lead?'<div class="lead-tag">подводка</div>':''}${esc(b.a)}</div>`;
  }
  let h=`<div class="blk${lead?' lead':''}" id="${b.id}">${lead?'<div class="lead-tag">подводка</div>':''}`;
  if(b.c) h+=`<div class="cue">${esc(b.c)}</div>`;
  b.L.forEach(x=>{
    let s=x.k==='P'?(x.tag?status(x.own):(status(x.men)?'':'')) : status(x.own);
    if(x.k==='P') s='';
    const hide=(s==='mine'&&st.hide&&!lead)?' hide':'';
    h+=`<div class="ln ${x.k}${s?' '+s:''}${hide}">${esc(x.t)}</div>`;
  });
  return h+'</div>';
}
function blockHit(b){
  if(b.a!==undefined) return status(b.men)?'m':'';
  return b.L.some(x=>x.k!=='P'&&status(x.own))?'s':'';
}

const out=document.getElementById('out');
function render(){
  document.documentElement.style.setProperty('--fs',st.fs+'px');
  const who=document.getElementById('who');
  who.innerHTML=st.sel.length?esc(st.sel.map(i=>BY[i].n).join(', '))+' <small>· изменить</small>':'Выбрать свою роль';
  const mine=st.mode==='mine'&&st.sel.length;
  document.getElementById('mAll').setAttribute('aria-pressed',String(!mine));
  document.getElementById('mMine').setAttribute('aria-pressed',String(!!mine));
  document.getElementById('mMine').disabled=!st.sel.length;
  document.getElementById('rehRow').hidden=!st.sel.length;
  document.getElementById('hideMine').checked=st.hide;
  document.getElementById('next').hidden=!st.sel.length;

  let h=''; const jump=[];
  let totLines=0,totScenes=0;
  SC.forEach((sc,si)=>{
    const hits=sc.blocks.map(blockHit);
    const n=sc.blocks.filter((b,i)=>hits[i]==='s').reduce((a,b)=>a+b.L.filter(x=>x.k!=='P'&&status(x.own)).length,0);
    if(n||hits.some(Boolean)){ totScenes++; } totLines+=n;
    const tag=st.sel.length?(n?`${n} строк`:(hits.some(Boolean)?'в ремарках':'')):'';
    if(mine&&!hits.some(Boolean)) return;
    jump.push([`s${si}`,sc.title+(tag?' · '+tag:'')]);
    h+=`<section class="scene"><div class="sh" id="s${si}">${esc(sc.title)}<span>${tag}</span></div>`;
    if(!mine){ sc.blocks.forEach(b=>h+=blockHTML(b,false)); }
    else{
      let last=-1;
      sc.blocks.forEach((b,i)=>{
        if(!hits[i]) return;
        const lead=i-1;
        const useLead=hits[i]==='s'&&lead>last&&lead>=0&&!hits[lead];
        const from=useLead?lead:i;
        if(last>=0&&from>last+1) h+='<div class="gap">···</div>';
        if(useLead) h+=blockHTML(sc.blocks[lead],true);
        h+=blockHTML(b,false); last=i;
      });
    }
    h+='</section>';
  });
  if(mine){
    h=`<div class="summary"><b>${esc(st.sel.map(i=>BY[i].n).join(', '))}</b>: ${totLines} строк в ${totScenes} сценах. Перед каждой репликой показана подводка, ремарки с вашим именем подсвечены.</div>`+h;
  } else if(!st.sel.length){
    h=`<div class="summary">Нажмите <b>«Выбрать свою роль»</b> и отметьте персонажа и свою фамилию. Ваши реплики подсветятся, а во вкладке «Моя роль» останутся только они.</div>`+h;
  }
  out.innerHTML=h;
  const j=document.getElementById('jump');
  j.innerHTML='<option value="">Перейти к сцене…</option>'+jump.map(([v,t])=>`<option value="${v}">${esc(t)}</option>`).join('');
}

// sheet
const sheet=document.getElementById('sheet');
function openSheet(){
  const sec=(k,t,p)=>`<h3>${t}</h3>${p?`<p>${p}</p>`:''}<div class="chips">`+ROLES.filter(r=>r.k===k).map(r=>
    `<button type="button" class="chip" data-id="${r.id}" aria-pressed="${st.sel.includes(r.id)}">${esc(r.n)}<small>${counts[r.id]||0}</small></button>`).join('')+'</div>';
  document.getElementById('sheetBody').innerHTML=
    '<p>Можно отметить несколько: персонажа, группу и свою фамилию. Число — сколько раз вы говорите или поёте.</p>'+
    sec('char','Персонажи')+sec('group','Группы','Строки группы подсвечиваются и её участникам.')+sec('actor','Участники','Фамилии, которые стоят в репликах и ремарках.');
  sheet.hidden=false;
}
document.getElementById('sheetBody').addEventListener('click',e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const id=c.dataset.id; const i=st.sel.indexOf(id);
  if(i>=0) st.sel.splice(i,1); else st.sel.push(id);
  c.setAttribute('aria-pressed',String(i<0));
});
document.getElementById('who').onclick=openSheet;
document.getElementById('clearSel').onclick=()=>{ st.sel=[]; sheet.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed','false')); };
document.getElementById('doneSel').onclick=()=>{ sheet.hidden=true; if(!st.sel.length) st.mode='all'; save(); render(); };
sheet.addEventListener('click',e=>{ if(e.target===sheet) document.getElementById('doneSel').click(); });

document.getElementById('mAll').onclick=()=>{ st.mode='all'; save(); render(); scrollTo(0,0); };
document.getElementById('mMine').onclick=()=>{ if(!st.sel.length) return; st.mode='mine'; save(); render(); scrollTo(0,0); };
document.getElementById('fsUp').onclick=()=>{ st.fs=Math.min(26,st.fs+1); save(); render(); };
document.getElementById('fsDown').onclick=()=>{ st.fs=Math.max(13,st.fs-1); save(); render(); };
document.getElementById('hideMine').onchange=e=>{ st.hide=e.target.checked; save(); render(); };
document.getElementById('jump').onchange=e=>{ const el=document.getElementById(e.target.value); if(el) el.scrollIntoView(); e.target.value=''; };
out.addEventListener('click',e=>{ const l=e.target.closest('.ln.hide'); if(l) l.classList.remove('hide'); });
document.getElementById('next').onclick=()=>{
  const top=document.querySelector('.bar').getBoundingClientRect().bottom+8;
  const els=[...out.querySelectorAll('.blk:not(.lead) .ln.mine, .blk:not(.lead) .ln.group, .act.mention')];
  const nx=els.find(el=>el.getBoundingClientRect().top>top+4);
  (nx||els[0])?.closest('.blk').scrollIntoView();
};
render();
})();
</script>
